name: Lieux halal
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/places.py", ".github/workflows/places.yml"]
permissions:
  contents: write
concurrency: places
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/places.py
      - name: Commit if changed
        run: |
          git config user.name "halal-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/places
          git diff --cached --quiet || (git commit -q -m "Lieux halal mis à jour" && git pull -q --rebase && git push)
