name: Rayons halal
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/shelves.py", "scripts/registry.py", ".github/workflows/shelves.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/shelves.py
      - run: python scripts/registry.py
      - name: Commit if changed
        run: |
          git config user.name "halal-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Rayons mis à jour" && git push)
