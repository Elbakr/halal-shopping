  "e570":{lvl:"check",n:{fr:"Acide stéarique",nl:"Stearinezuur",en:"Stearic acid",ar:"حمض الستياريك"},w:{fr:"Végétal ou animal.",nl:"Plantaardig of dierlijk.",en:"Plant or animal.",ar:"نباتي أو حيواني."}},

var WORDS = [

// Pure analysis: product -> {status, flags[]}
function analyse(p){
  var labels=(p.labels_tags||[]).concat(p.labels_hierarchy||[]).map(function(s){return String(s).toLowerCase()});
  var halal=labels.some(function(l){return /halal|hallal|helal/.test(l)});
  var certTag=labels.filter(function(l){return /halal|hallal|helal/.test(l)})[0]||"";
  var flags=[], seen={};
  (p.additives_tags||[]).forEach(function(t){
    var m=String(t).toLowerCase().replace(/^[a-z]{2}:/,"").match(/^(e\d{3})/); var k=m?m[1]:"";
    if(ADD[k]&&!seen[k]){seen[k]=1;flags.push({code:k.toUpperCase(),lvl:ADD[k].lvl,key:k,type:"add"})}
  });
  var txt=(p.ingredients_text||"")+" "+(p.ingredients_text_fr||"")+" "+(p.ingredients_text_en||"");
  WORDS.forEach(function(w){
    var m=txt.match(w.re);
    if(!m||seen[w.k])return;
    if(w.k==="gelatin"&&(SAFE_GEL.test(txt)||seen.e441))return;
    seen[w.k]=1; flags.push({code:m[1]||m[0],lvl:w.lvl,key:w.k,type:"word"});
  });

  var check=flags.some(function(f){return f.lvl==="check"});

  return {status:status,halal:halal,certTag:certTag,flags:flags};
}

var L="fr";
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function t(k){return (T[L]&&T[L][k])||T.fr[k]||""}
function applyLang(l){
  L=T[l]?l:"fr"; document.documentElement.lang=L; document.documentElement.dir=L==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.dataset.t)});
  $("q").placeholder=t("placeholder");
  document.querySelectorAll(".langs button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.l===L))});
  renderGuide(); if(last)render(last.p,last.r); renderHist(); store("hs_lang",L);
}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function renderGuide(){
  $("guide").innerHTML=Object.keys(ADD).map(function(k){var a=ADD[k];
    return "<tr><td><code>"+k.toUpperCase()+"</code></td><td>"+esc(a.n[L]||a.n.fr)+"</td><td>"+esc(a.w[L]||a.w.fr)+"</td></tr>"}).join("");
}

// ---------- Data ----------
var API="https://world.openfoodfacts.org";
var FIELDS="code,product_name,product_name_fr,brands,image_front_small_url,labels_tags,additives_tags,ingredients_text,ingredients_text_fr,ingredients_text_en,categories_tags";
function getJSON(u){return fetch(u,{headers:{"Accept":"application/json"}}).then(function(r){if(!r.ok)throw new Error("http");return r.json()})}
var last=null, live=true;

function msg(s,spin){$("msg").innerHTML=(spin?'<span class="spin" style="display:inline-block;vertical-align:middle;margin-inline-end:8px"></span>':"")+esc(s)}

function lookup(q){
  q=String(q||"").trim(); if(!q)return;
  $("q").value=q; msg(t("loading"),true); $("altsBox").hidden=true;
  var isCode=/^\d{8,14}$/.test(q);
  var req=isCode? getJSON(API+"/api/v2/product/"+q+"?fields="+FIELDS).then(function(j){return j&&j.status===1?j.product:null})
               : getJSON(API+"/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&json=1&page_size=1&fields="+FIELDS).then(function(j){return j&&j.products&&j.products[0]||null});
  req.then(function(p){
    if(!p){msg("");$("out").innerHTML='<div class="note">'+esc(t("notfound"))+' <a href="https://world.openfoodfacts.org/cgi/product.pl'+(isCode?"?code="+q:"")+'" target="_blank" rel="noopener">'+esc(t("add"))+'</a></div>';return}
    msg(""); var r=analyse(p); last={p:p,r:r}; render(p,r); remember(p); alternatives(p);
  }).catch(function(){live=false; demoFallback(q)});
}

function render(p,r){
  var name=p.product_name_fr||p.product_name||"—";
  var cls={ok:"ok",bad:"bad",conflict:"check",check:"check",none:"none",empty:"none"}[r.status];
  var expl={ok:t("e_ok"),conflict:t("e_conflict"),none:t("e_none"),empty:t("e_empty")}[r.status]||"";
  var flags=r.flags.map(function(f){
    var why=f.type==="add"?(ADD[f.key].w[L]||ADD[f.key].w.fr):(WTXT[f.key][L]||WTXT[f.key].fr);
    var nm=f.type==="add"?(ADD[f.key].n[L]||ADD[f.key].n.fr)+" — ":"";
    return '<div class="flag"><code class="'+f.lvl+'">'+esc(f.code)+'</code><p>'+esc(nm+why)+'</p></div>'}).join("");
  if(r.halal)flags='<div class="flag"><code class="ok">'+esc(t("label"))+'</code><p>'+esc(r.certTag.replace(/^[a-z]{2}:/,"").replace(/-/g," "))+'</p></div>'+flags;
  var img=p.image_front_small_url?'<img src="'+esc(p.image_front_small_url)+'" alt="">':"";
  $("out").innerHTML='<article class="card"><div class="verdict">'+img+'<div class="vtxt"><span class="pill '+cls+'">'+esc(t("s_"+r.status))+'</span><h3 class="pname">'+esc(name)+'</h3><span class="pmeta">'+esc((p.brands||"")+(p.code?" · "+p.code:""))+'</span>'+(expl?'<span class="hint">'+esc(expl)+'</span>':"")+'</div></div>'+(flags?'<div class="flags">'+flags+'</div>':"")+
    '<div class="src"><span>'+esc(t("data"))+'</span>'+(p.code&&live?'<a href="https://world.openfoodfacts.org/product/'+esc(p.code)+'" target="_blank" rel="noopener">'+esc(t("open"))+'</a>':"")+'</div></article>';
}

function alternatives(p){
  var cat=(p.categories_tags||[]).slice(-1)[0]; if(!cat||!live)return;
  getJSON(API+"/api/v2/search?categories_tags="+encodeURIComponent(cat)+"&labels_tags=en:halal&page_size=6&fields=code,product_name,product_name_fr,brands,image_front_small_url").then(function(j){
    var list=(j.products||[]).filter(function(x){return x.code!==p.code}).slice(0,6);
    if(!list.length)return;
    $("alts").innerHTML=list.map(function(x){return '<button type="button" class="alt" data-code="'+esc(x.code)+'">'+(x.image_front_small_url?'<img src="'+esc(x.image_front_small_url)+'" alt="">':"")+'<span>'+esc(x.product_name_fr||x.product_name||x.code)+'</span><span class="pmeta">'+esc(x.brands||"")+'</span></button>'}).join("");
    $("altsBox").hidden=false;
  }).catch(function(){});
}

function remember(p){
  var h=[];try{h=JSON.parse(store("hs_hist")||"[]")}catch(e){}
  h=h.filter(function(x){return x.c!==p.code}); h.unshift({c:p.code,n:p.product_name_fr||p.product_name||p.code}); h=h.slice(0,8);
  store("hs_hist",JSON.stringify(h)); renderHist();
}
function renderHist(){
  var h=[];try{h=JSON.parse(store("hs_hist")||"[]")}catch(e){}
  $("histBox").hidden=!h.length;
  $("hist").innerHTML=h.map(function(x){return '<button type="button" class="chipbtn" data-code="'+esc(x.c)+'">'+esc(x.n)+'</button>'}).join("");
}

var DEMO={

 "3168930010265":{code:"",product_name:"Merguez de bœuf (exemple)",brands:"Exemple",labels_tags:["en:halal"],additives_tags:["en:e471"],ingredients_text:"viande de bœuf, eau, épices, sel, dextrose, émulsifiant : E471"}
};
function demoFallback(q){
  var p=DEMO[q]||DEMO["5449000000996"];
  var r=analyse(p); last={p:p,r:r}; render(p,r);
  $("msg").textContent=t("demo");
}

// ---------- Camera / photo ----------
var stream=null, det=null;
function detector(){ if(det)return det; if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]})}catch(e){det=null}} return det }
$("cam").addEventListener("click",function(){
  if(stream){stopCam();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!detector()){msg(t("nocam"));return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream=s; var v=$("v"); v.srcObject=s; v.hidden=false; v.play(); msg(t("camhint"));
    (function loop(){ if(!stream)return; det.detect(v).then(function(c){ if(c&&c[0]){stopCam();lookup(c[0].rawValue)} else requestAnimationFrame(loop)}).catch(function(){requestAnimationFrame(loop)}) })();
  }).catch(function(){msg(t("nocam"))});
});
function stopCam(){ if(stream){stream.getTracks().forEach(function(x){x.stop()});stream=null} $("v").hidden=true }
$("photo").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  if(!detector()){msg(t("nocam"));return}
  createImageBitmap(f).then(function(b){return det.detect(b)}).then(function(c){ if(c&&c[0])lookup(c[0].rawValue); else msg(t("nobar")) }).catch(function(){msg(t("nobar"))});
  e.target.value="";
});

// ---------- Wiring ----------
$("f").addEventListener("submit",function(e){e.preventDefault();lookup($("q").value)});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-code]"); if(b){lookup(b.dataset.code);window.scrollTo({top:0,behavior:"smooth"});return}
  var l=e.target.closest(".langs button"); if(l)applyLang(l.dataset.l);
});
var start=store("hs_lang")||((navigator.language||"fr").slice(0,2));
applyLang(T[start]?start:"fr");
// Open in a working state: show a real lookup straight away
lookup("5449000000996");
})();
</script>
