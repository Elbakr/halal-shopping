<style>
/* Layout: a dark hero band holding the scanner (the product), then the answer as a full-colour banner, then shelves of real halal-claimed products to browse, then the traps to know. */
:root{
  --paper:#f2f5f3; --card:#ffffff; --ink:#0f211b; --muted:#56675f; --line:#d6dfda;
  --hero:#0f211b; --hero-ink:#eef5f1; --hero-muted:#9fb6ab;
  --go:#0a7550; --go-bright:#34d399; --go-soft:#e1f1ea;
  --wait:#8a5200; --wait-bright:#f5b544; --wait-soft:#fbefd9;
  --stop:#a8201f; --stop-bright:#ff6b5e; --stop-soft:#f8e1df;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
}

  --paper:#0b1612; --card:#12211b; --ink:#e7efea; --muted:#9db0a7; --line:#24382f;
  --hero:#06100c; --go:#4fd1a0; --go-soft:#123528; --wait:#f2b552; --wait-soft:#3a2a10; --stop:#ff8a80; --stop-soft:#3d1715; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
[dir="rtl"] body{font-family:var(--f-ar)}
img{max-width:100%}
[hidden]{display:none!important}
.in{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--go-bright);outline-offset:2px}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink);padding-top:env(safe-area-inset-top,0px)}
.hero .in{padding-block:18px 34px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--hero-ink)}
.bars{display:flex;gap:2px;height:24px}.bars i{display:block;background:var(--hero-ink)}.bars i:last-child{background:var(--go-bright)}
.word{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}.word b{color:var(--go-bright)}
.langsel{display:flex;align-items:center;gap:6px;border:1px solid #2c4a3e;border-radius:999px;padding:4px 10px;color:var(--hero-muted)}.langsel svg{width:16px;height:16px;flex:none}.langsel select{font:inherit;font-size:14px;background:transparent;color:var(--hero-ink);border:0;outline:0;cursor:pointer;max-width:9.5em}.langsel select option{color:#0f211b}
.langs button{font:inherit;font-size:13px;border:1px solid #2c4a3e;background:transparent;color:var(--hero-muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,8.5vw,60px);line-height:.98;letter-spacing:-.035em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--go-bright)}
[dir="rtl"] h1,[dir="rtl"] h2{font-family:var(--f-ar);letter-spacing:0;line-height:1.25}
.sub{color:var(--hero-muted);font-size:18px;margin:0;max-width:52ch}
.scanbox{display:flex;flex-direction:column;gap:10px}
.bigscan{font:inherit;font-weight:800;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;border:0;border-radius:16px;padding:18px 20px;background:var(--go-bright);color:#05211a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 30px -12px rgba(52,211,153,.6)}
.bigscan svg{width:26px;height:26px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:inherit;font-size:17px;padding:15px 16px;border-radius:14px;border:1px solid #2c4a3e;background:#16302a;color:var(--hero-ink)}
.row input::placeholder{color:var(--hero-muted)}
.row button{font:inherit;font-weight:700;border-radius:14px;border:1px solid var(--hero-ink);background:transparent;color:var(--hero-ink);padding:0 18px;cursor:pointer}
.mini{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--hero-muted)}
.mini label{text-decoration:underline;cursor:pointer;color:var(--hero-ink)}
.trust{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--hero-muted)}
.trust span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--go-bright);margin-inline-end:8px;vertical-align:middle}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
#msg{min-height:1.2em;font-size:14px;color:var(--hero-muted)}

/* Answer */
main .in{display:flex;flex-direction:column;gap:40px;padding-block:28px 48px}
.answer{border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 18px 40px -28px rgba(15,33,27,.45);scroll-margin-top:16px}
.banner{display:flex;gap:16px;align-items:center;padding:20px 22px;color:#fff}
.banner.ok{background:var(--go)}.banner.check{background:var(--wait)}.banner.bad{background:var(--stop)}.banner.none{background:#41544c}
.sig{flex:none;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sig svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btxt{min-width:0}
.btxt strong{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1.05;letter-spacing:-.02em}
.btxt span{font-size:15px;opacity:.92}
.prod{display:flex;gap:16px;padding:18px 22px;align-items:center}
.prod img{width:92px;height:92px;object-fit:contain;border-radius:12px;background:var(--paper);flex:none}
.prod h2{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.meta{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.flags{border-top:1px solid var(--line)}
.flag{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:13px 22px;border-bottom:1px solid var(--line);align-items:start}
.flag:last-child{border-bottom:0}
.flag code{font-family:var(--f-mono);font-size:13px;padding:3px 8px;border-radius:7px;white-space:nowrap}
.flag code.bad{background:var(--stop-soft);color:var(--stop)}.flag code.check{background:var(--wait-soft);color:var(--wait)}.flag code.ok{background:var(--go-soft);color:var(--go)}.flag code.info{background:var(--paper);color:var(--muted)}
.flag p{margin:0;font-size:15px;min-width:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:10px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.solid{background:var(--ink);color:var(--paper)}
.src{font-size:13px;color:var(--muted)}
.note{border-radius:16px;padding:16px 18px;background:var(--wait-soft);color:var(--wait)}

/* Shelves */
h2.sec{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,5vw,32px);letter-spacing:-.025em;margin:0}
.sechead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sechead p{margin:0;color:var(--muted)}
.shelves{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:14px}
.shelves::-webkit-scrollbar{display:none}
.shelf{font:inherit;font-weight:700;font-size:15px;white-space:nowrap;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer}
.shelf[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{font:inherit;text-align:start;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 12px 24px -18px rgba(15,33,27,.5)}
.tile .ph{aspect-ratio:1;border-radius:11px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain}
.tile b{font-size:14px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--go);background:var(--go-soft);border-radius:6px;padding:2px 7px}
.skel{background:linear-gradient(90deg,var(--line),var(--paper),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;aspect-ratio:3/4}
@keyframes sk{to{background-position:-200% 0}}

/* Traps */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.trap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.trap code{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--stop)}
.trap code.w{color:var(--wait)}
.trap b{font-family:var(--f-display);font-size:18px}
.trap p{margin:0;font-size:15px;color:var(--muted)}
details.all{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
details.all summary{cursor:pointer;padding:14px 18px;font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
td code{font-family:var(--f-mono);font-size:13px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.step{border-top:3px solid var(--ink);padding-top:12px}
.step b{display:block;font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:15px}

footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .in{padding-block:22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.mono{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.tile{transition:none}}
</style>
</head>

  var flags=[], seen={};
  var txt0=(p.ingredients_text||"")+" "+(p.ingredients_text_fr||"")+" "+(p.ingredients_text_en||"");

    var m=String(t).toLowerCase().replace(/^[a-z]{2}:/,"").match(/^(e\d{3})/); var k=m?m[1]:"";

  });
  var txt=(p.ingredients_text||"")+" "+(p.ingredients_text_fr||"")+" "+(p.ingredients_text_en||"");
  WORDS.forEach(function(w){
    var m=txt.match(w.re);
    if(!m||seen[w.k])return;
    if(w.k==="gelatin"&&(SAFE_GEL.test(txt)||seen.e441))return;
    seen[w.k]=1; flags.push({code:m[1]||m[0],lvl:w.lvl,key:w.k,type:"word"});
  });

}

  req.then(function(p){

    if(!p){last=null;out.innerHTML='<div class="note">'+esc(t("notfound"))+' <a href="https://world.openfoodfacts.org/cgi/product.pl'+(isCode?"?code="+q+"&type=add":"")+'" target="_blank" rel="noopener"><b>'+esc(t("add"))+'</b></a></div>';out.scrollIntoView({behavior:"smooth"});return}
    var r=analyse(p); last={p:p,r:r}; render(p,r);
    if(p.code&&push!==false){try{history.replaceState(null,"","#p"+p.code)}catch(e){}}
    out.scrollIntoView({behavior:"smooth"});
  }).catch(function(){msg(isCode?t("offline"):t("byname"))});
}

var ICON={ok:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',check:'<path d="M12 7v6M12 17h.01"/>',bad:'<path d="M7 7l10 10M17 7L7 17"/>',none:'<path d="M7 12h10"/>'};
function render(p,r){
  var key={ok:"ok",bad:"bad",conflict:"check",check:"check",none:"none",empty:"none"}[r.status];
  var flags=r.flags.map(function(f){
    var why=f.type==="add"?addW(f.key):wordW(f.key);
    var nm=f.type==="add"?addN(f.key)+" : ":"";
    return '<div class="flag"><code class="'+f.lvl+'">'+esc(f.code)+'</code><p>'+esc(nm+why)+'</p></div>'}).join("");
  if(r.halal)flags='<div class="flag"><code class="ok">'+esc(t("label"))+'</code><p>'+esc(r.certTag.replace(/^[a-z]{2}:/,"").replace(/-/g," "))+'</p></div>'+flags;
  var img=p.image_front_small_url||p.image_front_url;
  $("out").innerHTML='<article class="answer"><div class="banner '+key+'"><span class="sig"><svg viewBox="0 0 24 24">'+ICON[key]+'</svg></span><div class="btxt"><strong>'+esc(t("s_"+r.status))+'</strong><span>'+esc(t("e_"+r.status))+'</span></div></div>'+
   '<div class="prod">'+(img?'<img src="'+esc(img)+'" alt="">':"")+'<div style="min-width:0"><h2>'+esc(pname(p))+'</h2><div class="meta">'+esc(brand(p)+(p.code?" · "+p.code:""))+'</div></div></div>'+
   (flags?'<div class="flags">'+flags+'</div>':"")+
   '<div class="acts"><button type="button" class="btn solid" id="share">'+esc(t("share"))+'</button><a class="src" href="https://world.openfoodfacts.org/product/'+esc(p.code)+'" target="_blank" rel="noopener">'+esc(t("source"))+' · Open Food Facts</a></div></article>';
  $("share").onclick=function(){
    var url="https://halal.shopping/#p"+p.code, title=pname(p)+" — "+t("s_"+r.status);
    if(navigator.share){navigator.share({title:title,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){toast(t("copied"))},function(){})}
  };
}

var SHELFDATA=null;
function shelfData(){ if(SHELFDATA)return Promise.resolve(SHELFDATA); return getJSON("data/shelves.json?d="+new Date().toISOString().slice(0,10)).then(function(j){SHELFDATA=j;return j}) }
function loadShelf(k){
  shelf=k; renderShelves();
  if(!SHELFDATA)$("grid").innerHTML=new Array(9).join('<div class="skel"></div>');
  shelfData().then(function(j){
    var list=(j.shelves&&j.shelves[k])||[];
    $("grid").innerHTML=list.length?list.map(function(x){return '<button type="button" class="tile" data-code="'+esc(x.code)+'"><span class="ph"><img loading="lazy" src="'+esc(x.image_front_small_url)+'" alt=""></span><span class="tag">'+esc(t("s_ok"))+'</span><b>'+esc(pname(x))+'</b><small>'+esc(brand(x))+'</small></button>'}).join(""):'<p class="src">'+esc(t("empty"))+'</p>';
  }).catch(function(){ $("grid").innerHTML='<p class="src">'+esc(t("empty"))+'</p>' });
}

// ---------- Camera / photo ----------
var stream=null, det=null;
function detector(){ if(det)return det; if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]})}catch(e){}} return det }
$("cam").addEventListener("click",function(){
  if(stream){stopCam();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!detector()){msg(t("nocam"));$("q").focus();return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(s){
    stream=s; var v=$("v"); v.srcObject=s; v.hidden=false; v.play(); msg(t("camhint"));
    (function loop(){ if(!stream)return; det.detect(v).then(function(c){ if(c&&c[0]){stopCam();lookup(c[0].rawValue)} else requestAnimationFrame(loop)}).catch(function(){requestAnimationFrame(loop)}) })();
  }).catch(function(){msg(t("nocam"))});
});
function stopCam(){ if(stream){stream.getTracks().forEach(function(x){x.stop()});stream=null} $("v").hidden=true }
$("photo").addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return;
  if(!detector()){msg(t("nocam"));return}
  createImageBitmap(f).then(function(b){return det.detect(b)}).then(function(c){ if(c&&c[0])lookup(c[0].rawValue); else msg(t("nobar")) }).catch(function(){msg(t("nobar"))});
  e.target.value="";
});

// ---------- Wiring ----------
$("f").addEventListener("submit",function(e){e.preventDefault();lookup($("q").value)});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-code]"); if(b){lookup(b.dataset.code);return}
  var s=e.target.closest("[data-shelf]"); if(s){loadShelf(s.dataset.shelf);return}
});
function fromHash(){var m=location.hash.match(/^#p(\d{8,14})$/); if(m)lookup(m[1],false)}
window.addEventListener("hashchange",fromHash);
var COUNTRY={};
function cc(list,langs){list.split(" ").forEach(function(c){COUNTRY[c]=langs})}
cc("FR MC SN CI ML BF NE GN CM TG BJ CD CG GA CF TD BI RW MG HT NC PF RE GP MQ GF YT","fr fr");
cc("BE","fr nl de"); cc("CH","de fr"); cc("LU","fr de"); cc("CA","en fr"); cc("DJ","fr ar"); cc("KM","ar fr");
cc("MA DZ TN MR","ar fr"); cc("SA AE EG IQ JO KW LB LY OM QA SY YE BH PS SD","ar");
cc("NL SR AW CW SX","nl"); cc("DE AT LI","de");
cc("ES MX AR CO PE VE CL EC GT CU BO DO HN PY SV NI CR PA UY GQ","es"); cc("PR","es en");
cc("PT BR AO MZ GW CV ST TL","pt"); cc("TR","tr"); cc("CY","tr en"); cc("ID","id"); cc("MY BN","ms en"); cc("SG","en zh ms");
cc("RU BY KZ KG","ru"); cc("CN TW HK MO","zh"); cc("JP","ja"); cc("IN","hi en bn"); cc("BD","bn"); cc("PK","ur en");
Object.keys(COUNTRY).forEach(function(k){COUNTRY[k]=COUNTRY[k].split(" ")});
function browserLangs(){return (navigator.languages||[navigator.language||""]).map(function(x){return String(x).slice(0,2).toLowerCase()}).filter(function(x){return LANGS[x]})}
function pickFor(country){var langs=COUNTRY[country]||["en"], b=browserLangs();for(var i=0;i<b.length;i++){if(langs.indexOf(b[i])>=0)return b[i]}return langs[0]}
$("lang").innerHTML=Object.keys(LANGS).map(function(k){return '<option value="'+k+'">'+LANGS[k]+'</option>'}).join("");
$("lang").addEventListener("change",function(){store("hs_lang_choice",this.value);applyLang(this.value);try{history.replaceState(null,"","?lang="+this.value+location.hash)}catch(e){}});
var urlLang=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1];
var chosen=store("hs_lang_choice");
var first=(urlLang&&LANGS[urlLang])?urlLang:(chosen&&LANGS[chosen])?chosen:(browserLangs()[0]||"en");
applyLang(first);
if(!urlLang&&!chosen){
  var geo=function(u,f){return Promise.race([fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(f),new Promise(function(_,no){setTimeout(no,2500)})])};
  geo("https://api.country.is/",function(j){return j.country})
   .catch(function(){return geo("https://ipapi.co/json/",function(j){return j.country_code})})
   .then(function(c){ if(!c)return; c=String(c).toUpperCase(); var l=pickFor(c); if(l!==L)applyLang(l) }).catch(function(){});
}
loadShelf("candies");
fromHash();
})();
</script>
