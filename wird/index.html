.tree{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}.tree b{color:var(--gold);font-variant-numeric:tabular-nums}.tree em{flex-basis:100%;font-size:11.5px}
.chain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chain div{background:var(--surface);border-radius:12px;padding:10px;text-align:center}.chain b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--gold)}.chain small{font-size:11.5px;color:var(--muted)}

.langsel{display:inline-flex;gap:6px;align-items:center;margin-bottom:8px}.langsel select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px}

const D = {
 tahlil:{h:93,ar:"لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",tr:"Lâ ilâha illa-Llâh, wahdahu lâ charîka lah, lahu-l-mulku wa lahu-l-hamd, wa huwa 'alâ kulli chay'in qadîr",fr:"Nulle divinité excepté Allah, Seul, sans associé. À Lui la royauté, à Lui la louange, et Il est capable de toute chose.",r:"Dit 100 fois dans la journée : comme affranchir dix esclaves, 100 bonnes actions inscrites, 100 péchés effacés, et une protection contre Satan jusqu'au soir.",s:"Al-Bukhârî 3293, Muslim 2691",t:1,nom:"Tahlîl"},
 subbiham:{h:91,ar:"سُبْحَانَ اللهِ وَبِحَمْدِهِ",tr:"Subhâna-Llâhi wa bi-hamdih",fr:"Gloire et pureté à Allah, et par Sa louange.",r:"Dit 100 fois : les péchés sont effacés, même s'ils sont comme l'écume de la mer. Dit 100 fois matin et soir : nul ne viendra au Jour dernier avec mieux, sauf qui en a dit autant ou plus.",s:"Al-Bukhârî 6405, Muslim 2691 et 2692",t:1,nom:"Subhâna-Llâhi wa bi-hamdih"},
 sayyid:{h:79,ar:"اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",tr:"Allâhumma anta rabbî, lâ ilâha illâ ant, khalaqtanî wa ana 'abduk, wa ana 'alâ 'ahdika wa wa'dika mâ-stata't, a'ûdhu bika min charri mâ sana't, abû'u laka bi-ni'matika 'alayya, wa abû'u laka bi-dhanbî, fa-ghfir lî, fa-innahu lâ yaghfiru-dh-dhunûba illâ ant",fr:"Ô Allah, Tu es mon Seigneur, nulle divinité excepté Toi. Tu m'as créé et je suis Ton serviteur. Je tiens Ton pacte et Ta promesse autant que je le peux. Je cherche refuge auprès de Toi contre le mal que j'ai commis. Je reconnais Tes bienfaits envers moi et je reconnais mon péché. Pardonne-moi, car nul ne pardonne les péchés excepté Toi.",r:"Le maître des demandes de pardon. Dit le matin avec conviction et mort ce jour-là : il est des gens du Paradis. De même le soir pour la nuit.",s:"Al-Bukhârî 6306",t:1,nom:"Sayyid al-istighfâr"},
 kursi:{au:["q/002255"],ar:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",tr:"Allâhu lâ ilâha illâ huwa-l-hayyu-l-qayyûm, lâ ta'khudhuhu sinatun wa lâ nawm, lahu mâ fi-s-samâwâti wa mâ fi-l-ard, man dha-lladhî yachfa'u 'indahu illâ bi-idhnih, ya'lamu mâ bayna aydîhim wa mâ khalfahum, wa lâ yuhîtûna bi-chay'in min 'ilmihi illâ bimâ châ', wasi'a kursiyyuhu-s-samâwâti wa-l-ard, wa lâ ya'ûduhu hifzuhumâ, wa huwa-l-'aliyyu-l-'azîm.",fr:"Le Verset du Trône (Coran 2:255).",r:"Après chaque prière obligatoire : seule la mort le sépare de l'entrée au Paradis. Avant de dormir : un gardien d'Allah veille sur lui jusqu'au matin.",s:"An-Nasâ'î, as-Sunan al-kubrâ (authentifié par al-Albânî) ; al-Bukhârî 2311",t:1,nom:"Âyat al-Kursî"},
 wudu:{h:13,ar:"أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",tr:"Ach-hadu an lâ ilâha illa-Llâhu wahdahu lâ charîka lah, wa ach-hadu anna Muhammadan 'abduhu wa rasûluh",fr:"J'atteste qu'il n'y a de divinité qu'Allah, Seul, sans associé, et j'atteste que Muhammad est Son serviteur et Son messager.",r:"Après des ablutions faites avec soin : les huit portes du Paradis s'ouvrent pour lui, il entre par celle qu'il veut.",s:"Muslim 234",t:1,nom:"Après les ablutions"},
 radit:{ar:"رَضِيتُ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ رَسُولًا",tr:"Radîtu bi-Llâhi rabban, wa bi-l-islâmi dînan, wa bi-Muhammadin rasûlâ",fr:"Je suis satisfait d'Allah comme Seigneur, de l'islam comme religion et de Muhammad comme messager.",r:"Le Paradis lui est dû.",s:"Abû Dâwûd 1529 (authentique) ; récitation du matin et du soir rapportée par Ahmad",t:1,nom:"Radîtu bi-Llâh"},
 tasbih:{h:240,ar:"سُبْحَانَ اللهِ",tr:"Subhâna-Llâh",fr:"Gloire et pureté à Allah.",r:"Dit 100 fois : mille bonnes actions inscrites, ou mille péchés effacés.",s:"Muslim 2698",t:2,nom:"Tasbîh"},

 takbir:{h:241,ar:"اللهُ أَكْبَرُ",tr:"Allâhu akbar",fr:"Allah est le plus grand.",r:"Fait partie des paroles les plus aimées d'Allah.",s:"Muslim 2137",t:3,nom:"Takbîr"},
 salawat:{h:98,ar:"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",tr:"Allâhumma salli wa sallim 'alâ nabiyyinâ Muhammad",fr:"Ô Allah, prie sur notre Prophète Muhammad et accorde-lui la paix.",r:"Pour une prière sur le Prophète ﷺ, Allah prie dix fois sur lui, efface dix péchés et l'élève de dix degrés.",s:"Muslim 408 ; an-Nasâ'î 1297 (authentique)",t:2,nom:"Prière sur le Prophète ﷺ"},
 ikhlas:{au:["q/001001", "q/112001", "q/112002", "q/112003", "q/112004"],ar:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",tr:"Qul huwa-Llâhu ahad. Allâhu-s-samad. Lam yalid wa lam yûlad. Wa lam yakun lahu kufuwan ahad.",fr:"Sourate al-Ikhlâs (112).",r:"Équivaut au tiers du Coran. Avec les deux suivantes, trois fois matin et soir : elles te suffisent contre toute chose.",s:"Al-Bukhârî 5013 ; Abû Dâwûd 5082, at-Tirmidhî 3575",t:2,nom:"Al-Ikhlâs"},
 falaq:{au:["q/001001", "q/113001", "q/113002", "q/113003", "q/113004", "q/113005"],ar:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ",tr:"Qul a'ûdhu bi-rabbi-l-falaq. Min charri mâ khalaq. Wa min charri ghâsiqin idhâ waqab. Wa min charri-n-naffâthâti fi-l-'uqad. Wa min charri hâsidin idhâ hasad.",fr:"Sourate al-Falaq (113).",r:"Trois fois matin et soir avec al-Ikhlâs et an-Nâs : elles te suffisent contre toute chose.",s:"Abû Dâwûd 5082, at-Tirmidhî 3575",t:4,nom:"Al-Falaq"},
 nas:{au:["q/001001", "q/114001", "q/114002", "q/114003", "q/114004", "q/114005", "q/114006"],ar:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",tr:"Qul a'ûdhu bi-rabbi-n-nâs. Maliki-n-nâs. Ilâhi-n-nâs. Min charri-l-waswâsi-l-khannâs. Alladhî yuwaswisu fî sudûri-n-nâs. Mina-l-jinnati wa-n-nâs.",fr:"Sourate an-Nâs (114).",r:"Trois fois matin et soir avec al-Ikhlâs et al-Falaq : elles te suffisent contre toute chose.",s:"Abû Dâwûd 5082, at-Tirmidhî 3575",t:4,nom:"An-Nâs"},
 istighfar:{h:96,ar:"أَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ",tr:"Astaghfiru-Llâha wa atûbu ilayh",fr:"Je demande pardon à Allah et je me repens à Lui.",r:"Le Prophète ﷺ se repentait à Allah cent fois par jour.",s:"Muslim 2702 ; al-Bukhârî 6307",t:2,nom:"Istighfâr"},
 kalimatan:{ar:"سُبْحَانَ اللهِ وَبِحَمْدِهِ، سُبْحَانَ اللهِ الْعَظِيمِ",tr:"Subhâna-Llâhi wa bi-hamdih, subhâna-Llâhi-l-'azîm",fr:"Gloire et pureté à Allah, et par Sa louange ; gloire et pureté à Allah l'Immense.",r:"Deux paroles légères sur la langue, lourdes dans la balance, aimées du Tout-Miséricordieux.",s:"Al-Bukhârî 6406, Muslim 2694",t:3,nom:"Les deux paroles légères"},
 lahawla:{ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ",tr:"Lâ hawla wa lâ quwwata illâ bi-Llâh",fr:"Il n'y a de force ni de puissance qu'en Allah.",r:"Un trésor parmi les trésors du Paradis.",s:"Al-Bukhârî 6384, Muslim 2704",t:3,nom:"Lâ hawla"},
 juwayriya:{h:94,ar:"سُبْحَانَ اللهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ",tr:"Subhâna-Llâhi wa bi-hamdih, 'adada khalqih, wa ridâ nafsih, wa zinata 'archih, wa midâda kalimâtih",fr:"Gloire et pureté à Allah et par Sa louange, autant que le nombre de Ses créatures, autant qu'il Lui plaît, autant que le poids de Son Trône et l'encre de Ses paroles.",r:"Ces quatre paroles dites trois fois pèsent plus que tout le dhikr fait depuis l'aube.",s:"Muslim 2726",t:3,nom:"Dhikr de Juwayriya"},
 baqiyat:{ar:"سُبْحَانَ اللهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ",tr:"Subhâna-Llâh, wa-l-hamdu li-Llâh, wa lâ ilâha illa-Llâh, wa-Llâhu akbar",fr:"Gloire à Allah, louange à Allah, nulle divinité excepté Allah, Allah est le plus grand.",r:"Plus aimé du Prophète ﷺ que tout ce sur quoi le soleil se lève.",s:"Muslim 2695",t:3,nom:"Les paroles qui demeurent"},
 palmier:{ar:"سُبْحَانَ اللهِ الْعَظِيمِ وَبِحَمْدِهِ",tr:"Subhâna-Llâhi-l-'azîmi wa bi-hamdih",fr:"Gloire et pureté à Allah l'Immense, et par Sa louange.",r:"Un palmier est planté pour lui au Paradis.",s:"At-Tirmidhî 3464 (authentifié par al-Albânî)",t:3,nom:"Un palmier au Paradis"},
 bismillah:{h:86,ar:"بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ",tr:"Bismi-Llâhi-lladhî lâ yadurru ma'a-smihi chay'un fi-l-ardi wa lâ fi-s-samâ', wa huwa-s-samî'u-l-'alîm",fr:"Au nom d'Allah, avec le nom duquel rien ne nuit sur terre ni dans le ciel, et Il est l'Audient, l'Omniscient.",r:"Trois fois le matin et le soir : rien ne lui nuira.",s:"Abû Dâwûd 5088, at-Tirmidhî 3388",t:4,nom:"Bismi-Llâhi-lladhî"},
 kalimat:{h:216,ar:"أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",tr:"A'ûdhu bi-kalimâti-Llâhi-t-tâmmâti min charri mâ khalaq",fr:"Je cherche refuge dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé.",r:"Rien ne lui nuira tant qu'il reste en ce lieu ; récitée trois fois le soir.",s:"Muslim 2708 ; at-Tirmidhî 3604",t:4,nom:"Les paroles parfaites"},
 asbahna:{h:77,ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",tr:"Asbahnâ wa asbaha-l-mulku li-Llâh, wa-l-hamdu li-Llâh, lâ ilâha illa-Llâhu wahdahu lâ charîka lah, lahu-l-mulku wa lahu-l-hamdu wa huwa 'alâ kulli chay'in qadîr. Rabbi as'aluka khayra mâ fî hâdha-l-yawmi wa khayra mâ ba'dah, wa a'ûdhu bika min charri mâ fî hâdha-l-yawmi wa charri mâ ba'dah. Rabbi a'ûdhu bika mina-l-kasali wa sû'i-l-kibar. Rabbi a'ûdhu bika min 'adhâbin fi-n-nâri wa 'adhâbin fi-l-qabr.",fr:"Nous voici au matin et la royauté appartient à Allah… Seigneur, je Te demande le bien de ce jour et de ce qui le suit, et je cherche refuge auprès de Toi contre le mal de ce jour et de ce qui le suit, contre la paresse et les maux de la vieillesse, contre le châtiment du Feu et de la tombe.",r:"Invocation que le Prophète ﷺ disait chaque matin.",s:"Muslim 2723",t:5,nom:"Asbahnâ"},
 amsayna:{ar:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",tr:"Amsaynâ wa amsâ-l-mulku li-Llâh, wa-l-hamdu li-Llâh, lâ ilâha illa-Llâhu wahdahu lâ charîka lah, lahu-l-mulku wa lahu-l-hamdu wa huwa 'alâ kulli chay'in qadîr. Rabbi as'aluka khayra mâ fî hâdhihi-l-laylati wa khayra mâ ba'dahâ, wa a'ûdhu bika min charri mâ fî hâdhihi-l-laylati wa charri mâ ba'dahâ. Rabbi a'ûdhu bika mina-l-kasali wa sû'i-l-kibar. Rabbi a'ûdhu bika min 'adhâbin fi-n-nâri wa 'adhâbin fi-l-qabr.",fr:"Nous voici au soir et la royauté appartient à Allah… Seigneur, je Te demande le bien de cette nuit et de ce qui la suit, et je cherche refuge auprès de Toi contre son mal et celui de ce qui la suit.",r:"Invocation que le Prophète ﷺ disait chaque soir.",s:"Muslim 2723",t:5,nom:"Amsaynâ"},
 bika_m:{h:78,ar:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",tr:"Allâhumma bika asbahnâ, wa bika amsaynâ, wa bika nahyâ, wa bika namûtu, wa ilayka-n-nuchûr",fr:"Ô Allah, par Toi nous atteignons le matin et le soir, par Toi nous vivons et mourons, et vers Toi est la résurrection.",r:"Enseignée par le Prophète ﷺ pour le matin.",s:"Abû Dâwûd 5068, at-Tirmidhî 3391",t:5,nom:"Allâhumma bika asbahnâ"},
 bika_s:{ar:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",tr:"Allâhumma bika amsaynâ, wa bika asbahnâ, wa bika nahyâ, wa bika namûtu, wa ilayka-l-masîr",fr:"Ô Allah, par Toi nous atteignons le soir et le matin, par Toi nous vivons et mourons, et vers Toi est le retour.",r:"Enseignée par le Prophète ﷺ pour le soir.",s:"Abû Dâwûd 5068, at-Tirmidhî 3391",t:5,nom:"Allâhumma bika amsaynâ"},
 salam:{h:66,ar:"أَسْتَغْفِرُ اللهَ (٣) — اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ",tr:"Astaghfiru-Llâh (3 fois). Allâhumma anta-s-salâm, wa minka-s-salâm, tabârakta yâ dha-l-jalâli wa-l-ikrâm",fr:"Je demande pardon à Allah (3 fois). Ô Allah, Tu es la Paix et de Toi vient la paix ; béni sois-Tu, Ô Plein de majesté et de générosité.",r:"Ce que le Prophète ﷺ disait dès la fin de la prière.",s:"Muslim 591",t:5,nom:"Dès le salut final"},
 reveil:{h:1,ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",tr:"Al-hamdu li-Llâhi-lladhî ahyânâ ba'da mâ amâtanâ wa ilayhi-n-nuchûr",fr:"Louange à Allah qui nous a redonné la vie après nous avoir fait mourir, et vers Lui est la résurrection.",r:"Ce que le Prophète ﷺ disait au réveil.",s:"Al-Bukhârî 6312",t:5,nom:"Au réveil"},
 taarra:{h:2,ar:"لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللهِ، وَلَا إِلَهَ إِلَّا اللهُ، وَاللهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ — اللَّهُمَّ اغْفِرْ لِي",tr:"Lâ ilâha illa-Llâhu wahdahu lâ charîka lah, lahu-l-mulku wa lahu-l-hamd, wa huwa 'alâ kulli chay'in qadîr. Al-hamdu li-Llâh, wa subhâna-Llâh, wa lâ ilâha illa-Llâh, wa-Llâhu akbar, wa lâ hawla wa lâ quwwata illâ bi-Llâh. Allâhumma-ghfir lî",fr:"À dire si l'on se réveille dans la nuit, puis demander pardon.",r:"Celui qui se réveille la nuit et dit cela puis invoque : il est exaucé ; s'il fait ses ablutions et prie, sa prière est acceptée.",s:"Al-Bukhârî 1154",t:2,nom:"Réveil pendant la nuit"},
 bismika:{h:105,ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",tr:"Bismika-Llâhumma amûtu wa ahyâ",fr:"C'est en Ton nom, ô Allah, que je meurs et que je vis.",r:"Ce que le Prophète ﷺ disait en se couchant.",s:"Al-Bukhârî 6324",t:5,nom:"En se couchant"},
 baqara:{au:["q/002285", "q/002286"],ar:"آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",tr:"Âmana-r-rasûlu bimâ unzila ilayhi min rabbihi wa-l-mu'minûn, kullun âmana bi-Llâhi wa malâ'ikatihi wa kutubihi wa rusulih, lâ nufarriqu bayna ahadin min rusulih, wa qâlû sami'nâ wa ata'nâ, ghufrânaka rabbanâ wa ilayka-l-masîr. Lâ yukallifu-Llâhu nafsan illâ wus'ahâ, lahâ mâ kasabat wa 'alayhâ mâ-ktasabat, rabbanâ lâ tu'âkhidhnâ in nasînâ aw akhta'nâ, rabbanâ wa lâ tahmil 'alaynâ isran kamâ hamaltahu 'ala-lladhîna min qablinâ, rabbanâ wa lâ tuhammilnâ mâ lâ tâqata lanâ bih, wa-'fu 'annâ wa-ghfir lanâ wa-rhamnâ, anta mawlânâ fa-nsurnâ 'ala-l-qawmi-l-kâfirîn.",fr:"Fin de la sourate al-Baqara.",r:"Celui qui les récite la nuit, elles lui suffisent.",s:"Al-Bukhârî 5009, Muslim 807",t:4,nom:"Fin d'al-Baqara"},
 adhan:{h:25,ar:"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",tr:"Allâhumma rabba hâdhihi-d-da'wati-t-tâmmah, wa-s-salâti-l-qâ'imah, âti Muhammadan al-wasîlata wa-l-fadîlah, wab'ath-hu maqâman mahmûdan-illadhî wa'adtah",fr:"Ô Allah, Seigneur de cet appel parfait et de cette prière qui va être accomplie, accorde à Muhammad le rang suprême et l'excellence, et élève-le à la station louable que Tu lui as promise.",r:"Après l'appel à la prière : l'intercession du Prophète ﷺ lui est acquise au Jour de la Résurrection.",s:"Al-Bukhârî 614",t:1,nom:"Après l'adhân"},
 maison:{h:16,ar:"بِسْمِ اللهِ، تَوَكَّلْتُ عَلَى اللهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ",tr:"Bismi-Llâh, tawakkaltu 'ala-Llâh, wa lâ hawla wa lâ quwwata illâ bi-Llâh",fr:"Au nom d'Allah, je place ma confiance en Allah, il n'y a de force ni de puissance qu'en Allah.",r:"En sortant de chez soi : il lui est dit « tu es guidé, suffi et protégé », et Satan s'écarte de lui.",s:"Abû Dâwûd 5095, at-Tirmidhî 3426",t:4,nom:"En sortant de chez soi"},
 repas:{food:1,h:180,ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",tr:"Al-hamdu li-Llâhi-lladhî at'amanî hâdhâ, wa razaqanîhi min ghayri hawlin minnî wa lâ quwwah",fr:"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans force ni puissance de ma part.",r:"Après le repas : ses péchés passés lui sont pardonnés.",s:"Abû Dâwûd 4023, at-Tirmidhî 3458 (bon)",t:1,nom:"Après le repas"},
 majlis:{h:15,ar:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ",tr:"Subhânaka-Llâhumma wa bi-hamdik, ach-hadu an lâ ilâha illâ ant, astaghfiruka wa atûbu ilayk",fr:"Gloire à Toi, ô Allah, et par Ta louange. J'atteste qu'il n'y a de divinité que Toi. Je Te demande pardon et je me repens à Toi.",r:"En quittant une assemblée : ce qui s'y est passé lui est pardonné.",s:"At-Tirmidhî 3433 (authentique)",t:2,nom:"En quittant une assemblée"},
 lailaha:{"ar": "لَا إِلَهَ إِلَّا اللَّهُ", "tr": "Lâ ilâha illa-Llâh", "fr": "Nulle divinité excepté Allah.", "r": "La meilleure des invocations du dhikr.", "s": "At-Tirmidhî 3383, Ibn Mâja 3800 (hasan selon al-Albânî)", "t": 3, "nom": "Lâ ilâha illa-Llâh"},
 entree_maison:{"ar": "بِسْمِ اللَّهِ", "tr": "Bismi-Llâh", "fr": "Au nom d'Allah.", "r": "Quand l'homme mentionne Allah en entrant chez lui et en mangeant, le diable dit (aux siens) : « Pas de gîte ni de dîner pour vous. »", "s": "Muslim (n° 2018) — sahih. Le hadith ordonne de mentionner Allah sans fixer de formule ; « Bismi-Llâh » en est la forme minimale. Puis saluer les siens.", "t": 4, "nom": "Entrer à la maison"},
 entree_toilettes:{"h": 10, "ar": "بِسْمِ اللَّهِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ", "tr": "Bismi-Llâh. Allâhumma innî a'ûdhu bika mina l-khubuthi wa l-khabâ'ith", "fr": "Au nom d'Allah. Ô Allah, je cherche refuge auprès de Toi contre les démons mâles et femelles.", "r": "Dire « Bismi-Llâh » en entrant place un voile entre les yeux des djinns et la nudité des fils d'Adam.", "s": "Bukhârî (n° 142) et Muslim (n° 375) pour la demande de refuge ; Tirmidhî (n° 606), sahih selon al-Albânî, pour le « Bismi-Llâh ».", "t": 4, "nom": "Entrer aux toilettes"},
 sortie_toilettes:{"h": 11, "ar": "غُفْرَانَكَ", "tr": "Ghufrânak", "fr": "(J'implore) Ton pardon.", "r": "", "s": "Abû Dâwûd (n° 30), Tirmidhî (n° 7), Ibn Mâja (n° 300) — sahih selon al-Albânî.", "t": 5, "nom": "Sortir des toilettes"},
 entree_mosquee:{"h": 20, "ar": "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "tr": "Allâhumma f-tah lî abwâba rahmatik", "fr": "Ô Allah, ouvre-moi les portes de Ta miséricorde.", "r": "", "s": "Muslim (n° 713) — sahih. Abû Dâwûd (n° 465, sahih selon al-Albânî) ajoute de saluer d'abord le Prophète ﷺ. Entrer du pied droit.", "t": 5, "nom": "Entrer à la mosquée"},
 sortie_mosquee:{"h": 21, "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "tr": "Allâhumma innî as'aluka min fadlik", "fr": "Ô Allah, je Te demande (une part) de Ta grâce.", "r": "", "s": "Muslim (n° 713) — sahih. Sortir du pied gauche.", "t": 5, "nom": "Sortir de la mosquée"},
 avant_repas:{"food": 1, "ar": "بِسْمِ اللَّهِ", "tr": "Bismi-Llâh", "fr": "Au nom d'Allah.", "r": "", "s": "Bukhârî (n° 5376) et Muslim (n° 2022) : « Mentionne le nom d'Allah, mange de ta main droite et mange de ce qui est devant toi. »", "t": 5, "nom": "Avant de manger"},
 oubli_bismillah:{"food": 1, "h": 178, "ar": "بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ", "tr": "Bismi-Llâhi awwalahû wa âkhirah", "fr": "Au nom d'Allah, au début et à la fin (de ce repas).", "r": "", "s": "Abû Dâwûd (n° 3767), Tirmidhî (n° 1858) — sahih selon al-Albânî.", "t": 5, "nom": "Oubli du Bismi-Llâh"},
 habillement:{"h": 5, "ar": "الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", "tr": "Al-hamdu li-Llâhi lladhî kasânî hâdhâ th-thawba wa razaqanîhi min ghayri hawlin minnî wa lâ quwwa", "fr": "Louange à Allah qui m'a vêtu de ce vêtement et me l'a accordé sans force ni puissance de ma part.", "r": "Ses péchés antérieurs lui sont pardonnés.", "s": "Abû Dâwûd (n° 4023) — hasan selon al-Albânî, sauf l'ajout « et ses péchés à venir », qui n'est pas authentique (à ne pas afficher).", "t": 1, "nom": "S'habiller"},
 habit_neuf:{"h": 6, "ar": "اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ", "tr": "Allâhumma laka l-hamdu, anta kasawtanîh, as'aluka min khayrihî wa khayri mâ suni'a lah, wa a'ûdhu bika min charrihî wa charri mâ suni'a lah", "fr": "Ô Allah, à Toi la louange, c'est Toi qui m'en as vêtu. Je Te demande son bien et le bien pour lequel il a été fait, et je cherche refuge auprès de Toi contre son mal et le mal pour lequel il a été fait.", "r": "", "s": "Abû Dâwûd (n° 4020), Tirmidhî (n° 1767) — sahih selon al-Albânî.", "t": 5, "nom": "Habit neuf"},
 monter_vehicule:{"h": 206, "ar": "بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَكَ اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": "Bismi-Llâh, al-hamdu li-Llâh, subhâna lladhî sakhkhara lanâ hâdhâ wa mâ kunnâ lahû muqrinîn, wa innâ ilâ rabbinâ la-munqalibûn. Al-hamdu li-Llâh, al-hamdu li-Llâh, al-hamdu li-Llâh. Allâhu akbar, Allâhu akbar, Allâhu akbar. Subhânaka-Llâhumma innî zalamtu nafsî fa-ghfir lî, fa-innahû lâ yaghfiru dh-dhunûba illâ ant", "fr": "Au nom d'Allah. Louange à Allah. Gloire à Celui qui a mis ceci à notre service alors que nous n'étions pas capables de le dominer, et c'est vers notre Seigneur que nous retournerons. Louange à Allah (3 fois). Allah est le plus grand (3 fois). Gloire à Toi, ô Allah, je me suis fait du tort à moi-même, pardonne-moi donc, car nul ne pardonne les péchés sauf Toi.", "r": "Le Prophète ﷺ sourit et dit : « Ton Seigneur s'émerveille de Son serviteur quand il dit : pardonne-moi mes péchés, sachant que nul autre que Lui ne pardonne les péchés. »", "s": "Abû Dâwûd (n° 2602), Tirmidhî (n° 3446) — sahih selon al-Albânî. Texte selon Hisn al-Muslim ; certaines versions portent « subhânaka » sans « Allâhumma ».", "t": 5, "nom": "Monter en voiture"},
 voyage:{"h": 207, "ar": "اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ، اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا الْبِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَلِيفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ", "tr": "Allâhu akbar, Allâhu akbar, Allâhu akbar. Subhâna lladhî sakhkhara lanâ hâdhâ wa mâ kunnâ lahû muqrinîn, wa innâ ilâ rabbinâ la-munqalibûn. Allâhumma innâ nas'aluka fî safarinâ hâdhâ l-birra wa t-taqwâ, wa mina l-'amali mâ tardâ. Allâhumma hawwin 'alaynâ safaranâ hâdhâ wa-twi 'annâ bu'dah. Allâhumma anta s-sâhibu fî s-safar, wa l-khalîfatu fî l-ahl. Allâhumma innî a'ûdhu bika min wa'thâ'i s-safar, wa ka'âbati l-manzar, wa sû'i l-munqalabi fî l-mâli wa l-ahl", "fr": "Allah est le plus grand (3 fois). Gloire à Celui qui a mis ceci à notre service alors que nous n'étions pas capables de le dominer, et c'est vers notre Seigneur que nous retournerons. Ô Allah, nous Te demandons dans ce voyage la bonté et la piété, et les œuvres qui Te satisfont. Ô Allah, facilite-nous ce voyage et raccourcis-en pour nous la distance. Ô Allah, Tu es le Compagnon du voyage et Celui qui veille sur la famille. Ô Allah, je cherche refuge auprès de Toi contre les fatigues du voyage, les spectacles affligeants et un mauvais retour dans les biens et la famille.", "r": "", "s": "Muslim (n° 1342) — sahih. Au retour, on le répète en ajoutant : « Âyibûna tâ'ibûna 'âbidûna li-rabbinâ hâmidûn ».", "t": 5, "nom": "Partir en voyage"},
 pluie:{"h": 172, "ar": "اللَّهُمَّ صَيِّبًا نَافِعًا", "tr": "Allâhumma sayyiban nâfi'â", "fr": "Ô Allah, (fais-en) une pluie abondante et bénéfique.", "r": "", "s": "Bukhârî (n° 1032) — sahih.", "t": 5, "nom": "Quand il pleut"},
 apres_pluie:{"h": 173, "ar": "مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ", "tr": "Mutirnâ bi-fadli-Llâhi wa rahmatih", "fr": "Nous avons reçu la pluie par la grâce d'Allah et Sa miséricorde.", "r": "", "s": "Bukhârî (n° 846), Muslim (n° 71) — sahih. Le hadith qudsî oppose celui qui dit cela (croyant en Allah) à celui qui attribue la pluie aux astres.", "t": 5, "nom": "Après la pluie"},
 vent:{"h": 167, "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا فِيهَا، وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا فِيهَا، وَشَرِّ مَا أُرْسِلَتْ بِهِ", "tr": "Allâhumma innî as'aluka khayrahâ, wa khayra mâ fîhâ, wa khayra mâ ursilat bih, wa a'ûdhu bika min charrihâ, wa charri mâ fîhâ, wa charri mâ ursilat bih", "fr": "Ô Allah, je Te demande son bien, le bien qu'il contient et le bien avec lequel il a été envoyé ; et je cherche refuge auprès de Toi contre son mal, le mal qu'il contient et le mal avec lequel il a été envoyé.", "r": "", "s": "Muslim (n° 899) — sahih.", "t": 5, "nom": "Quand le vent souffle"},
 tonnerre:{"h": 168, "ar": "سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ", "tr": "Subhâna lladhî yusabbihu r-ra'du bi-hamdihî wa l-malâ'ikatu min khîfatih", "fr": "Gloire à Celui dont le tonnerre célèbre la louange, ainsi que les anges, par crainte de Lui.", "r": "", "s": "Athar (parole du Compagnon 'Abd Allâh ibn az-Zubayr, non attribuée au Prophète ﷺ) : al-Muwatta' de Mâlik et al-Adab al-Mufrad de Bukhârî ; chaîne mawqûf jugée sahih par al-Albânî. À présenter comme pratique d'un Compagnon.", "t": 5, "nom": "Quand il tonne"},
 eternuement:{"ar": "الْحَمْدُ لِلَّهِ", "tr": "Al-hamdu li-Llâh", "fr": "Louange à Allah. (Puis, à qui lui répond « Yarhamuka-Llâh », il dit : « Yahdîkumu-Llâhu wa yuslihu bâlakum » — Qu'Allah vous guide et améliore votre état.)", "r": "", "s": "Bukhârî (n° 6224) — sahih.", "t": 5, "nom": "Après un éternuement"},
 reponse_eternuement:{"h": 188, "ar": "يَرْحَمُكَ اللَّهُ", "tr": "Yarhamuka-Llâh", "fr": "Qu'Allah te fasse miséricorde (à dire à celui qui a éternué et a loué Allah).", "r": "", "s": "Bukhârî (n° 6224) — sahih. Réponse de l'éternueur : يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.", "t": 5, "nom": "Répondre à qui éternue"},
 visite_malade:{"h": 148, "ar": "أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ", "tr": "As'alu-Llâha l-'azîma rabba l-'archi l-'azîmi an yachfiyak", "fr": "Je demande à Allah l'Immense, Seigneur du Trône immense, de te guérir.", "r": "Allah le guérit, sauf si son terme est arrivé.", "s": "Abû Dâwûd (n° 3106), Tirmidhî (n° 2083) — sahih selon al-Albânî. On peut aussi dire « Lâ ba's, tahûrun in châ'a-Llâh » (Bukhârî n° 3616).", "t": 4, "nom": "Visite d'un malade"},
 karb:{"h": 122, "ar": "لَا إِلَهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ", "tr": "Lâ ilâha illa-Llâhu l-'azîmu l-halîm, lâ ilâha illa-Llâhu rabbu l-'archi l-'azîm, lâ ilâha illa-Llâhu rabbu s-samâwâti wa rabbu l-ardi wa rabbu l-'archi l-karîm", "fr": "Nulle divinité sauf Allah, l'Immense, le Longanime. Nulle divinité sauf Allah, Seigneur du Trône immense. Nulle divinité sauf Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du Trône noble.", "r": "", "s": "Bukhârî (n° 6346), Muslim (n° 2730) — sahih. Le Prophète ﷺ le disait dans la détresse.", "t": 5, "nom": "Angoisse, détresse"},
 dhu_n_nun:{"h": 124, "ar": "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "tr": "Lâ ilâha illâ anta subhânaka innî kuntu mina z-zâlimîn", "fr": "Nulle divinité sauf Toi, gloire à Toi ! J'ai été parmi les injustes.", "r": "Aucun musulman n'invoque par elle pour quoi que ce soit sans qu'Allah ne lui réponde.", "s": "Tirmidhî (n° 3505) — sahih selon al-Albânî. Texte coranique (al-Anbiyâ' 21:87).", "t": 3, "nom": "Invocation de Yûnus"},
 hamm_hazan:{"h": 121, "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ", "tr": "Allâhumma innî a'ûdhu bika mina l-hammi wa l-hazan, wa l-'ajzi wa l-kasal, wa l-bukhli wa l-jubn, wa dala'i d-dayni wa ghalabati r-rijâl", "fr": "Ô Allah, je cherche refuge auprès de Toi contre le souci et la tristesse, l'incapacité et la paresse, l'avarice et la lâcheté, le poids de la dette et la domination des hommes.", "r": "", "s": "Bukhârî (n° 6369) — sahih.", "t": 5, "nom": "Souci et tristesse"},
 colere:{"h": 193, "ar": "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "tr": "A'ûdhu bi-Llâhi mina ch-chaytâni r-rajîm", "fr": "Je cherche refuge auprès d'Allah contre le diable maudit.", "r": "S'il disait cela, ce qu'il ressent le quitterait.", "s": "Bukhârî (n° 3282), Muslim (n° 2610) — sahih.", "t": 4, "nom": "Sous l'effet de la colère"},
 chose_rejouissante:{"ar": "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ", "tr": "Al-hamdu li-Llâhi lladhî bi-ni'matihî tatimmu s-sâlihât", "fr": "Louange à Allah, par la grâce de qui s'accomplissent les bonnes choses.", "r": "", "s": "Ibn Mâja (n° 3803) — hasan selon al-Albânî. Dit par le Prophète ﷺ quand survenait une chose qui le réjouissait.", "t": 5, "nom": "Une chose réjouissante"},
 chose_deplaisante:{"ar": "الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ", "tr": "Al-hamdu li-Llâhi 'alâ kulli hâl", "fr": "Louange à Allah en toute circonstance.", "r": "", "s": "Ibn Mâja (n° 3803) — hasan selon al-Albânî. Dit par le Prophète ﷺ quand survenait une chose qui lui déplaisait.", "t": 5, "nom": "Une chose déplaisante"},

KK("hal.p","Scanne un produit, trouve une adresse halal près de toi, confirme ou corrige pour ta communauté.","Scan a product, find a halal place near you, confirm or correct it for your community.","امسح منتجًا، وجد مكانًا حلالًا قريبًا منك، وأكّد المعلومة أو صحّحها لمجتمعك.","Scan een product, vind een halal adres bij jou in de buurt, bevestig of corrigeer het voor je gemeenschap.","Bir ürünü tara, yakınında helal bir adres bul, topluluğun için doğrula veya düzelt.","Pindai produk, temukan tempat halal di dekatmu, konfirmasi atau koreksi untuk komunitasmu.");
KK("hal.h","« Celui qui indique un bien a la même récompense que celui qui le fait. »","“Whoever guides to something good has a reward like the one who does it.”","«مَنْ دَلَّ عَلَى خَيْرٍ فَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ»","“Wie naar iets goeds leidt, krijgt dezelfde beloning als wie het doet.”","“Bir hayra vesile olan, onu yapan kadar sevap alır.”","“Barang siapa menunjukkan kebaikan, ia mendapat pahala seperti pelakunya.”");

KK("sy.p","Réunis tes compteurs et tes progrès sur tous tes téléphones. Sans compte, sans email, sans mot de passe : un seul Face ID ou une empreinte par téléphone.","Combine your counters and progress on all your phones. No account, no email, no password: just one Face ID or fingerprint per phone.","اجمع عداداتك وتقدّمك على كل هواتفك. بلا حساب ولا بريد ولا كلمة مرور: بصمة وجه أو إصبع واحدة لكل هاتف.","Breng je tellers en voortgang samen op al je telefoons. Geen account, geen e-mail, geen wachtwoord: één Face ID of vingerafdruk per telefoon.","Sayaçlarını ve ilerlemeni tüm telefonlarında birleştir. Hesap, e-posta, şifre yok: telefon başına tek bir Face ID veya parmak izi.","Satukan penghitung dan kemajuanmu di semua ponselmu. Tanpa akun, email, atau kata sandi: cukup satu Face ID atau sidik jari per ponsel.");

KK("sy.note","Entre deux iPhone (ou deux Android), la clé passe toute seule. Entre un iPhone et un Android, choisis « autre appareil » et scanne le QR avec le premier téléphone, une seule fois.","Between two iPhones (or two Androids), the key moves on its own. Between an iPhone and an Android, choose “another device” and scan the QR with the first phone, just once.","بين جهازي آيفون (أو أندرويد) ينتقل المفتاح تلقائيًا. بين آيفون وأندرويد اختر «جهاز آخر» وامسح الرمز بالهاتف الأول مرة واحدة.","Tussen twee iPhones (of twee Androids) gaat de sleutel vanzelf mee. Tussen een iPhone en een Android kies je ‘ander apparaat’ en scan je de QR één keer met de eerste telefoon.","İki iPhone (veya iki Android) arasında anahtar kendiliğinden geçer. iPhone ile Android arasında “başka cihaz”ı seç ve QR'ı ilk telefonla bir kez tara.","Antara dua iPhone (atau dua Android), kunci berpindah sendiri. Antara iPhone dan Android, pilih “perangkat lain” lalu pindai QR dengan ponsel pertama, sekali saja.");

KK("lire.intro2","Une lettre à la fois : tu l'entends, tu la vois sous ses formes, puis tu la retrouves dans tes invocations.","One letter at a time: hear it, see its shapes, then find it in your invocations.","حرفٌ في كل مرة: تسمعه، وترى أشكاله، ثم تجده في أذكارك.","Eén letter tegelijk: hoor hem, zie zijn vormen en vind hem terug in je smeekbeden.","Her seferinde bir harf: dinle, şekillerini gör, sonra dualarında bul.","Satu huruf setiap kali: dengarkan, lihat bentuknya, lalu temukan dalam doamu.");

KK("inv.txt","J'ai pensé à toi. Cette invocation tient en une minute, on la dit ensemble aujourd'hui ?","I thought of you. This invocation takes a minute, shall we say it together today?","تذكّرتك. هذا الذكر يستغرق دقيقة، نقوله معًا اليوم؟","Ik dacht aan je. Deze smeekbede duurt een minuut, zeggen we haar vandaag samen?","Seni düşündüm. Bu zikir bir dakika sürer, bugün birlikte okuyalım mı?","Aku teringat kamu. Zikir ini hanya satu menit, kita baca bersama hari ini?");

KK("auto.intro","Ton iPhone lance l'écoute tout seul au bon moment. Réglage une seule fois dans l'app Raccourcis.","Your iPhone starts the recitation by itself at the right moment. Set it up once in the Shortcuts app.","يبدأ هاتفك التلاوة تلقائيًا في الوقت المناسب. يُضبط مرة واحدة في تطبيق الاختصارات.","Je iPhone start de recitatie vanzelf op het juiste moment. Eén keer instellen in de app Opdrachten.","iPhone'un okumayı doğru anda kendisi başlatır. Kestirmeler uygulamasında bir kez ayarlanır.","iPhone memutar bacaan sendiri pada waktu yang tepat. Atur sekali di aplikasi Pintasan.");

KK("auto.smart","Le matin : adhkar du matin. Le vendredi : sourate al-Kahf. L'après-midi et le soir : adhkar du soir.","Morning: morning adhkar. Friday: Surah al-Kahf. Afternoon and evening: evening adhkar.","صباحًا: أذكار الصباح. يوم الجمعة: سورة الكهف. بعد العصر والمساء: أذكار المساء.","Ochtend: ochtendadhkar. Vrijdag: soera al-Kahf. Middag en avond: avondadhkar.","Sabah: sabah zikirleri. Cuma: Kehf suresi. Öğleden sonra ve akşam: akşam zikirleri.","Pagi: zikir pagi. Jumat: surah al-Kahfi. Sore dan malam: zikir petang.");

KK("auto.copied","Lien copié. Colle-le dans l'action « Ouvrir les URL ».","Link copied. Paste it into the “Open URLs” action.","نُسخ الرابط. ألصقه في إجراء «فتح عناوين URL».","Link gekopieerd. Plak hem in de actie “Open URL's”.","Bağlantı kopyalandı. “URL'leri Aç” eylemine yapıştır.","Tautan disalin. Tempel di tindakan “Buka URL”.");
KK("auto.steps","1. Ouvre l'app Raccourcis, onglet Automatisation, touche +.|2. Choisis le déclencheur : « Quitter » un lieu (Domicile), « CarPlay » ou « Bluetooth » (ta voiture), ou « Réveil » (est arrêté).|3. Choisis « Exécuter immédiatement ».|4. Ajoute l'action « Ouvrir les URL » et colle le lien de Wird.","1. Open the Shortcuts app, Automation tab, tap +.|2. Pick the trigger: “Leave” a place (Home), “CarPlay” or “Bluetooth” (your car), or “Alarm” (is stopped).|3. Choose “Run Immediately”.|4. Add the “Open URLs” action and paste the Wird link.","1. افتح تطبيق الاختصارات، تبويب الأتمتة، المس +.|2. اختر المُشغِّل: «المغادرة» من مكان (المنزل)، أو «CarPlay» أو «بلوتوث» (سيارتك)، أو «المنبّه» (عند إيقافه).|3. اختر «تشغيل فورًا».|4. أضف إجراء «فتح عناوين URL» وألصق رابط ورد.","1. Open de app Opdrachten, tab Automatisering, tik op +.|2. Kies de trigger: een locatie “Verlaten” (Thuis), “CarPlay” of “Bluetooth” (je auto), of “Wekker” (wordt gestopt).|3. Kies “Voer direct uit”.|4. Voeg de actie “Open URL's” toe en plak de Wird-link.","1. Kestirmeler uygulamasını aç, Otomasyon sekmesi, + simgesine dokun.|2. Tetikleyiciyi seç: bir yerden “Ayrılma” (Ev), “CarPlay” veya “Bluetooth” (araban) ya da “Alarm” (durdurulduğunda).|3. “Hemen Çalıştır”ı seç.|4. “URL'leri Aç” eylemini ekle ve Wird bağlantısını yapıştır.","1. Buka aplikasi Pintasan, tab Otomatisasi, ketuk +.|2. Pilih pemicu: “Pergi” dari lokasi (Rumah), “CarPlay” atau “Bluetooth” (mobilmu), atau “Alarm” (dihentikan).|3. Pilih “Jalankan Segera”.|4. Tambahkan tindakan “Buka URL” dan tempel tautan Wird.");
KK("auto.note","Le départ du domicile se détecte à partir d'environ 100 mètres (limite de l'iPhone). La voiture, elle, se détecte dès qu'elle se connecte. Sur Android : une appli d'automatisation (Routines, Tasker) avec l'action « Ouvrir une URL ».","Leaving home is detected from about 100 metres (an iPhone limit). The car is detected as soon as it connects. On Android: an automation app (Routines, Tasker) with an “Open URL” action.","يُكتشف الخروج من البيت ابتداءً من نحو 100 متر (حدّ الآيفون). أما السيارة فتُكتشف فور اتصالها. على أندرويد: تطبيق أتمتة (Routines أو Tasker) مع إجراء «فتح رابط».","Het verlaten van huis wordt vanaf ongeveer 100 meter herkend (grens van de iPhone). De auto wordt herkend zodra hij verbindt. Op Android: een automatiseringsapp (Routines, Tasker) met de actie “URL openen”.","Evden çıkış yaklaşık 100 metreden itibaren algılanır (iPhone sınırı). Araba ise bağlanır bağlanmaz algılanır. Android'de: “URL aç” eylemli bir otomasyon uygulaması (Routines, Tasker).","Keluar rumah terdeteksi mulai sekitar 100 meter (batas iPhone). Mobil terdeteksi begitu terhubung. Di Android: aplikasi otomatisasi (Routines, Tasker) dengan tindakan “Buka URL”.");

KK("ad.note","L'iPhone joue sa sonnerie habituelle à l'arrivée de la notification : un site ne peut pas la remplacer. L'adhan démarre dès que tu touches la notification, ou tout seul si Wird est ouvert à l'heure. Récitation : Aaqib Azeez, licence CC BY-SA 4.0 (Wikimedia Commons).","Your phone plays its usual sound when the notification arrives: a website cannot replace it. The adhan starts as soon as you tap the notification, or by itself if Wird is open at prayer time. Recitation: Aaqib Azeez, CC BY-SA 4.0 (Wikimedia Commons).","يُصدر الهاتف نغمته المعتادة عند وصول الإشعار ولا يمكن لموقع تغييرها. يبدأ الأذان عند لمس الإشعار، أو تلقائيًا إن كان ورد مفتوحًا وقت الصلاة. التلاوة: عاقب عزيز، رخصة CC BY-SA 4.0.","Je telefoon speelt zijn gewone geluid bij een melding: een website kan dat niet vervangen. De adhan start zodra je op de melding tikt, of vanzelf als Wird open is. Recitatie: Aaqib Azeez, CC BY-SA 4.0.","Bildirim gelince telefon kendi sesini çalar: bir site bunu değiştiremez. Ezan bildirime dokununca başlar, Wird açıksa vakitte kendiliğinden çalar. Okuyan: Aaqib Azeez, CC BY-SA 4.0.","Ponsel memutar nada biasanya saat notifikasi tiba: situs web tidak bisa menggantinya. Azan dimulai saat kamu menyentuh notifikasi, atau otomatis jika Wird terbuka. Muazin: Aaqib Azeez, CC BY-SA 4.0.");

K("Valable 15 minutes. Sur l'autre écran : Bilan, puis « J'ai un code ».","Valid for 15 minutes. On the other screen: Progress, then “I have a code”.","صالح 15 دقيقة. على الشاشة الأخرى: الحصيلة ثم «لدي رمز».","15 minuten geldig. Op het andere scherm: Overzicht, dan ‘Ik heb een code’.","15 dakika geçerli. Diğer ekranda: Özet, sonra “Kodum var”.","Berlaku 15 menit. Di layar lain: Ringkasan, lalu “Saya punya kode”.");
K("Rien à transférer pour l'instant : comptez d'abord quelques invocations.","Nothing to transfer yet: count a few invocations first.","لا شيء للنقل بعد: عُدّ بعض الأذكار أولًا.","Nog niets over te zetten: tel eerst enkele smeekbeden.","Henüz aktarılacak bir şey yok: önce birkaç zikir say.","Belum ada yang bisa dipindahkan: hitung beberapa zikir dulu.");
K("Vous aviez commencé dans Safari ?","Did you start in Safari?","هل بدأت في سفاري؟","Was je in Safari begonnen?","Safari'de mi başlamıştın?","Kamu mulai di Safari?");
K("Ouvrez Wird dans Safari, allez dans Bilan, touchez « Obtenir un code », puis saisissez-le ici.","Open Wird in Safari, go to Progress, tap “Get a code”, then enter it here.","افتح Wird في سفاري، اذهب إلى الحصيلة، المس «احصل على رمز» ثم أدخله هنا.","Open Wird in Safari, ga naar Overzicht, tik op ‘Code aanvragen’ en voer hem hier in.","Wird'i Safari'de aç, Özet'e git, “Kod al”a dokun, sonra buraya gir.","Buka Wird di Safari, masuk ke Ringkasan, ketuk “Dapatkan kode”, lalu masukkan di sini.");
/* Partage */
KK("share.text","J'utilise Wird pour mes adhkar du matin, du soir et après chaque prière : comptés, sourcés, avec la récitation. Gratuit, sans pub. « Celui qui appelle à une bonne voie reçoit la même récompense que ceux qui la suivent » (Muslim).","I use Wird for my morning, evening and after-prayer adhkar: counted, sourced, with recitation. Free, no ads. “Whoever calls to guidance gets the same reward as those who follow it” (Muslim).","أستعمل Wird لأذكار الصباح والمساء وبعد كل صلاة: معدودة وموثقة ومع التلاوة. مجاني بلا إعلانات. «من دعا إلى هدى كان له من الأجر مثل أجور من تبعه» (مسلم).","Ik gebruik Wird voor mijn ochtend-, avond- en na-het-gebed adhkar: geteld, met bron en voordracht. Gratis, zonder reclame. ‘Wie oproept tot het goede, krijgt dezelfde beloning als wie het volgt’ (Muslim).","Sabah, akşam ve namaz sonrası zikirlerim için Wird kullanıyorum: sayılı, kaynaklı ve tilavetli. Ücretsiz, reklamsız. “Kim hidayete çağırırsa, ona uyanların sevabı kadar sevap alır” (Müslim).","Aku memakai Wird untuk zikir pagi, petang, dan setelah salat: terhitung, bersumber, dengan bacaan. Gratis, tanpa iklan. “Siapa yang mengajak kepada petunjuk, mendapat pahala seperti orang yang mengikutinya” (Muslim).");
KK("share.copied","Lien copié. Colle-le dans tes conversations.","Link copied. Paste it into your chats.","نُسخ الرابط. ألصقه في محادثاتك.","Link gekopieerd. Plak hem in je gesprekken.","Bağlantı kopyalandı. Sohbetlerine yapıştır.","Tautan disalin. Tempel di obrolanmu.");
KK("share.btn","Partager Wird","Share Wird","شارك Wird","Wird delen","Wird'i paylaş","Bagikan Wird");
KK("chain.title","Multiplie tes récompenses","Multiply your rewards","ضاعف أجرك","Vermenigvuldig je beloning","Sevabını katla","Lipatgandakan pahalamu");
KK("chain.hadith","« Celui qui appelle à une bonne voie reçoit la même récompense que tous ceux qui la suivent, sans que rien ne soit retiré de leur récompense. »","“Whoever calls to guidance will have a reward like the rewards of all who follow him, without that taking anything away from their rewards.”","«مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الْأَجْرِ مِثْلُ أُجُورِ مَنْ تَبِعَهُ، لَا يَنْقُصُ ذَلِكَ مِنْ أُجُورِهِمْ شَيْئًا»","“Wie oproept tot leiding, krijgt een beloning gelijk aan die van allen die hem volgen, zonder dat iets van hun beloning afgaat.”","“Kim doğru yola çağırırsa, ona uyanların sevabı kadar sevap alır; onların sevabından hiçbir şey eksilmez.”","“Barang siapa mengajak kepada petunjuk, ia mendapat pahala seperti pahala orang yang mengikutinya, tanpa mengurangi pahala mereka sedikit pun.”");
KK("chain.src","Le Prophète ﷺ · Muslim 2674","The Prophet ﷺ · Muslim 2674","النبي ﷺ · رواه مسلم 2674","De Profeet ﷺ · Muslim 2674","Peygamber ﷺ · Müslim 2674","Nabi ﷺ · Muslim 2674");
KK("chain.explain","Chaque personne qui fait ses adhkar grâce à ton lien : chacun de ses tasbîh compte aussi pour toi, chaque jour, in shâ' Allah. Et quand elle partage à son tour, ceux qu'elle amène suivent la même voie : ta chaîne grandit sans que tu fasses rien de plus.","Every person who does their adhkar through your link: each of their tasbih counts for you too, every day, in sha' Allah. And when they share in turn, the people they bring follow the same path: your chain grows without you doing anything more.","كل من يذكر الله عبر رابطك: كل تسبيحة يقولها لك مثل أجرها كل يوم إن شاء الله. وإذا شارك بدوره، تبعه آخرون على الطريق نفسه: تكبر سلسلتك دون أن تفعل شيئًا إضافيًا.","Ieder die via jouw link zijn adhkar doet: elke tasbih van hem telt ook voor jou, elke dag, in sha' Allah. En als hij op zijn beurt deelt, volgen de mensen die hij meebrengt dezelfde weg: je keten groeit zonder dat jij nog iets doet.","Bağlantınla zikreden herkesin her tesbihi, her gün senin için de yazılır, inşallah. O da paylaşınca getirdikleri aynı yolu izler: sen hiçbir şey yapmadan zincirin büyür.","Setiap orang yang berzikir lewat tautanmu: setiap tasbihnya juga dihitung untukmu, setiap hari, insya Allah. Dan saat ia membagikan, orang yang ia bawa mengikuti jalan yang sama: rantaimu tumbuh tanpa kamu berbuat apa-apa lagi.");
KK("chain.lvl","Niveau","Level","المستوى","Niveau","Seviye","Tingkat");
KK("chain.if5","Si chacun partage à 5 personnes","If everyone shares with 5 people","إن شارك كل واحد مع 5 أشخاص","Als iedereen met 5 mensen deelt","Herkes 5 kişiyle paylaşırsa","Jika setiap orang berbagi ke 5 orang");
KK("chain.people","personnes dans ta chaîne","people in your chain","شخصًا في سلسلتك","mensen in je keten","kişi zincirinde","orang di rantaimu");
KK("chain.today","dhikr de ta chaîne aujourd'hui","dhikr by your chain today","ذكرًا من سلسلتك اليوم","dhikr van je keten vandaag","zincirinin bugünkü zikri","zikir rantaimu hari ini");
KK("chain.levels","générations","generations","أجيال","generaties","nesil","generasi");
KK("chain.empty","Personne n'est encore venu par ton lien. Un seul message à un groupe de famille suffit à lancer ta chaîne.","Nobody has come through your link yet. One message to a family group is enough to start your chain.","لم يأتِ أحد عبر رابطك بعد. رسالة واحدة إلى مجموعة العائلة تكفي لبدء سلسلتك.","Nog niemand kwam via jouw link. Eén bericht in een familiegroep volstaat om je keten te starten.","Henüz bağlantınla gelen yok. Aile grubuna tek bir mesaj zincirini başlatmaya yeter.","Belum ada yang datang lewat tautanmu. Satu pesan ke grup keluarga cukup untuk memulai rantaimu.");
KK("chain.done","Moment accompli. Offre la même récompense à tes proches :","Completed. Give your loved ones the same reward:","تمّ. أهدِ أحبابك الأجر نفسه:","Voltooid. Geef je dierbaren dezelfde beloning:","Tamamlandı. Sevdiklerine aynı sevabı hediye et:","Selesai. Berikan pahala yang sama untuk orang tersayang:");

/* Traductions des invocations : anglais (n nom, m sens, r mérite) et mérite en arabe (ra) */
const DL={
 tahlil:{n:"Tahlil",m:"None has the right to be worshipped but Allah alone, without partner. His is the dominion and His is the praise, and He has power over all things.",r:"Said 100 times in a day: like freeing ten slaves, 100 good deeds recorded, 100 sins erased, and protection from Satan until evening.",ra:"من قالها في يوم مئة مرة كانت له عدل عشر رقاب، وكُتبت له مئة حسنة، ومُحيت عنه مئة سيئة، وكانت له حرزًا من الشيطان حتى يمسي."},
 subbiham:{n:"Subhana-Llahi wa bi-hamdih",m:"Glory and praise be to Allah.",r:"Said 100 times: sins are erased even if they are like the foam of the sea. Said 100 times morning and evening: no one will bring anything better on the Day of Resurrection, except one who said as much or more.",ra:"من قالها مئة مرة حُطّت خطاياه وإن كانت مثل زبد البحر، ومن قالها حين يصبح وحين يمسي مئة مرة لم يأت أحد يوم القيامة بأفضل مما جاء به إلا أحد قال مثل ما قال أو زاد."},
 sayyid:{n:"Master of forgiveness",m:"O Allah, You are my Lord, none has the right to be worshipped but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.",r:"The master of seeking forgiveness. Whoever says it in the morning with conviction and dies that day is among the people of Paradise; likewise in the evening for the night.",ra:"سيد الاستغفار: من قالها من النهار موقنًا بها فمات من يومه قبل أن يمسي فهو من أهل الجنة، ومن قالها من الليل وهو موقن بها فمات قبل أن يصبح فهو من أهل الجنة."},
 kursi:{n:"Ayat al-Kursi",m:"The Verse of the Throne (Quran 2:255).",r:"After every obligatory prayer: only death stands between him and Paradise. Before sleeping: a guardian from Allah protects him until morning.",ra:"من قرأها دبر كل صلاة مكتوبة لم يمنعه من دخول الجنة إلا أن يموت، ومن قرأها إذا أوى إلى فراشه لم يزل عليه من الله حافظ حتى يصبح."},
 wudu:{n:"After ablution",m:"I bear witness that none has the right to be worshipped but Allah alone, without partner, and I bear witness that Muhammad is His servant and messenger.",r:"After a careful ablution: the eight gates of Paradise are opened for him, to enter by whichever he wishes.",ra:"من توضأ فأحسن الوضوء ثم قالها فُتحت له أبواب الجنة الثمانية يدخل من أيها شاء."},
 radit:{n:"Raditu bi-Llah",m:"I am pleased with Allah as Lord, with Islam as religion and with Muhammad as messenger.",r:"Paradise becomes his due.",ra:"وجبت له الجنة."},
 tasbih:{n:"Tasbih",m:"Glory be to Allah.",r:"Said 100 times: a thousand good deeds are recorded or a thousand sins erased.",ra:"من سبّح مئة تسبيحة كُتبت له ألف حسنة أو حُطّت عنه ألف خطيئة."},
 hamd:{n:"Tahmid",m:"All praise is for Allah.",r:"Praise fills the scale.",ra:"الحمد لله تملأ الميزان."},
 takbir:{n:"Takbir",m:"Allah is the Greatest.",r:"Among the words most beloved to Allah.",ra:"من أحب الكلام إلى الله."},
 salawat:{n:"Blessings on the Prophet ﷺ",m:"O Allah, send blessings and peace upon our Prophet Muhammad.",r:"For one blessing on the Prophet ﷺ, Allah blesses him ten times, erases ten sins and raises him ten degrees.",ra:"من صلى عليه صلاة واحدة صلى الله عليه عشر صلوات، وحُطّت عنه عشر خطيئات، ورُفعت له عشر درجات."},
 ikhlas:{n:"Al-Ikhlas",m:"Surah al-Ikhlas (112).",r:"Equal to a third of the Quran. With the next two, three times morning and evening: they suffice you against everything.",ra:"تعدل ثلث القرآن، ومع المعوذتين ثلاثًا حين تمسي وحين تصبح تكفيك من كل شيء."},
 falaq:{n:"Al-Falaq",m:"Surah al-Falaq (113).",r:"Three times morning and evening with al-Ikhlas and an-Nas: they suffice you against everything.",ra:"مع الإخلاص والناس ثلاثًا حين تمسي وحين تصبح تكفيك من كل شيء."},
 nas:{n:"An-Nas",m:"Surah an-Nas (114).",r:"Three times morning and evening with al-Ikhlas and al-Falaq: they suffice you against everything.",ra:"مع الإخلاص والفلق ثلاثًا حين تمسي وحين تصبح تكفيك من كل شيء."},
 istighfar:{n:"Istighfar",m:"I seek Allah's forgiveness and repent to Him.",r:"The Prophet ﷺ repented to Allah a hundred times a day.",ra:"كان النبي ﷺ يتوب إلى الله في اليوم مئة مرة."},
 kalimatan:{n:"The two light words",m:"Glory and praise be to Allah; glory be to Allah the Magnificent.",r:"Two words light on the tongue, heavy on the scale, beloved to the Most Merciful.",ra:"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن."},
 lahawla:{n:"La hawla",m:"There is no power and no strength except with Allah.",r:"A treasure from the treasures of Paradise.",ra:"كنز من كنوز الجنة."},
 juwayriya:{n:"Dhikr of Juwayriya",m:"Glory and praise be to Allah, as many as His creatures, as much as pleases Him, as the weight of His Throne and the ink of His words.",r:"These four phrases said three times outweigh all the dhikr made since dawn.",ra:"أربع كلمات ثلاث مرات لو وُزنت بما قلتِ منذ اليوم لوزنتهن."},
 baqiyat:{n:"The enduring good words",m:"Glory be to Allah, praise be to Allah, none has the right to be worshipped but Allah, Allah is the Greatest.",r:"More beloved to the Prophet ﷺ than everything the sun rises upon.",ra:"أحب إلى النبي ﷺ مما طلعت عليه الشمس."},
 palmier:{n:"A palm tree in Paradise",m:"Glory and praise be to Allah the Magnificent.",r:"A palm tree is planted for him in Paradise.",ra:"غُرست له نخلة في الجنة."},
 bismillah:{n:"Bismi-Llahi-lladhi",m:"In the name of Allah, with whose name nothing on earth or in heaven can cause harm, and He is the All-Hearing, the All-Knowing.",r:"Three times morning and evening: nothing will harm him.",ra:"من قالها ثلاثًا حين يصبح وحين يمسي لم يضره شيء."},
 kalimat:{n:"The perfect words",m:"I seek refuge in the perfect words of Allah from the evil of what He has created.",r:"Nothing will harm him while he stays in that place; said three times in the evening.",ra:"لم يضره شيء حتى يرتحل من منزله ذلك."},
 asbahna:{n:"Asbahna",m:"We have reached the morning and the dominion belongs to Allah… My Lord, I ask You for the good of this day and what follows it, and I seek refuge in You from its evil and the evil of what follows it, from laziness and the evils of old age, from punishment in the Fire and in the grave.",r:"A supplication the Prophet ﷺ said every morning.",ra:"كان النبي ﷺ يقولها إذا أصبح."},
 amsayna:{n:"Amsayna",m:"We have reached the evening and the dominion belongs to Allah… My Lord, I ask You for the good of this night and what follows it, and I seek refuge in You from its evil and the evil of what follows it.",r:"A supplication the Prophet ﷺ said every evening.",ra:"كان النبي ﷺ يقولها إذا أمسى."},
 bika_m:{n:"Allahumma bika asbahna",m:"O Allah, by You we reach the morning and the evening, by You we live and die, and to You is the resurrection.",r:"Taught by the Prophet ﷺ for the morning.",ra:"علّمها النبي ﷺ للصباح."},
 bika_s:{n:"Allahumma bika amsayna",m:"O Allah, by You we reach the evening and the morning, by You we live and die, and to You is the return.",r:"Taught by the Prophet ﷺ for the evening.",ra:"علّمها النبي ﷺ للمساء."},
 salam:{n:"Right after the salam",m:"I seek Allah's forgiveness (3 times). O Allah, You are Peace and from You comes peace; blessed are You, Owner of majesty and honour.",r:"What the Prophet ﷺ said as soon as he finished the prayer.",ra:"ما كان النبي ﷺ يقوله إذا انصرف من صلاته."},
 reveil:{n:"On waking",m:"Praise be to Allah who gave us life after causing us to die, and to Him is the resurrection.",r:"What the Prophet ﷺ said on waking.",ra:"ما كان النبي ﷺ يقوله إذا استيقظ."},
 taarra:{n:"Waking at night",m:"To say when waking during the night, then ask for forgiveness.",r:"Whoever wakes at night and says this then supplicates is answered; if he makes ablution and prays, his prayer is accepted.",ra:"من تعارّ من الليل فقالها ثم دعا استُجيب له، فإن توضأ وصلى قُبلت صلاته."},
 bismika:{n:"Lying down",m:"In Your name, O Allah, I die and I live.",r:"What the Prophet ﷺ said when lying down.",ra:"ما كان النبي ﷺ يقوله إذا أخذ مضجعه."},
 baqara:{n:"End of al-Baqara",m:"The last two verses of Surah al-Baqara (2:285-286).",r:"Whoever recites them at night, they suffice him.",ra:"من قرأ بالآيتين من آخر سورة البقرة في ليلة كفتاه."},
 adhan:{n:"After the adhan",m:"O Allah, Lord of this perfect call and of the prayer about to be established, grant Muhammad the intercession and the excellence, and raise him to the praised station You promised him.",r:"After the call to prayer: the Prophet's ﷺ intercession becomes his on the Day of Resurrection.",ra:"حلّت له شفاعة النبي ﷺ يوم القيامة."},
 maison:{n:"Leaving home",m:"In the name of Allah, I place my trust in Allah, there is no power and no strength except with Allah.",r:"Leaving home: it is said to him “you are guided, sufficed and protected”, and Satan moves away from him.",ra:"يقال له: هُديت وكُفيت ووُقيت، وتنحّى عنه الشيطان."},
 repas:{n:"After eating",m:"Praise be to Allah who fed me this and provided it for me without any power or strength on my part.",r:"After the meal: his past sins are forgiven.",ra:"غُفر له ما تقدم من ذنبه."},
 majlis:{n:"Leaving a gathering",m:"Glory be to You, O Allah, and praise. I bear witness that none has the right to be worshipped but You. I seek Your forgiveness and repent to You.",r:"Leaving a gathering: what happened in it is forgiven.",ra:"غُفر له ما كان في مجلسه ذلك."},
 lailaha:{"n": "Lâ ilâha illa-Llâh", "m": "There is no god but Allah.", "r": "The best remembrance.", "ra": "أفضل الذكر لا إله إلا الله."},
 entree_maison:{"n": "Entering home", "m": "In the name of Allah.", "r": "When a man mentions Allah on entering his home and when eating, Satan says (to his companions): “No shelter and no dinner for you.”", "ra": "إذا ذكر الرجل اللهَ عند دخوله وعند طعامه قال الشيطان: لا مبيت لكم ولا عشاء."},
 entree_toilettes:{"n": "Entering the toilet", "m": "In the name of Allah. O Allah, I seek refuge in You from the male and female devils.", "r": "Saying “Bismillah” on entering places a veil between the eyes of the jinn and the private parts of the children of Adam.", "ra": "سترُ ما بين أعين الجن وعورات بني آدم أن يقول: بسم الله."},
 sortie_toilettes:{"n": "Leaving the toilet", "m": "(I seek) Your forgiveness.", "r": "", "ra": ""},
 entree_mosquee:{"n": "Entering the mosque", "m": "O Allah, open for me the gates of Your mercy.", "r": "", "ra": ""},
 sortie_mosquee:{"n": "Leaving the mosque", "m": "O Allah, I ask You of Your bounty.", "r": "", "ra": ""},
 avant_repas:{"n": "Before eating", "m": "In the name of Allah.", "r": "", "ra": ""},
 oubli_bismillah:{"n": "Forgot Bismillah", "m": "In the name of Allah, at its beginning and at its end.", "r": "", "ra": ""},
 habillement:{"n": "Getting dressed", "m": "Praise be to Allah who clothed me with this garment and provided it for me without any might or power on my part.", "r": "His previous sins are forgiven.", "ra": "غُفر له ما تقدّم من ذنبه."},
 habit_neuf:{"n": "New clothes", "m": "O Allah, to You belongs all praise; You have clothed me with it. I ask You for its good and the good for which it was made, and I seek refuge in You from its evil and the evil for which it was made.", "r": "", "ra": ""},
 monter_vehicule:{"n": "Getting into a vehicle", "m": "In the name of Allah. Praise be to Allah. Glory be to the One who has subjected this to us, for we could not have done so ourselves, and to our Lord we shall return. Praise be to Allah (3 times). Allah is the Greatest (3 times). Glory be to You, O Allah; I have wronged myself, so forgive me, for none forgives sins but You.", "r": "The Prophet ﷺ smiled and said: “Your Lord marvels at His servant when he says: forgive me my sins, knowing that none but Him forgives sins.”", "ra": "إن ربك يعجب من عبده إذا قال: اغفر لي ذنوبي، يعلم أنه لا يغفر الذنوب غيري."},
 voyage:{"n": "Setting out on a journey", "m": "Allah is the Greatest (3 times). Glory be to the One who has subjected this to us, for we could not have done so ourselves, and to our Lord we shall return. O Allah, we ask You on this journey for righteousness and piety, and for deeds that please You. O Allah, make this journey easy for us and shorten its distance. O Allah, You are the Companion on the journey and the Guardian of the family. O Allah, I seek refuge in You from the hardships of travel, from distressing sights, and from an evil return to property and family.", "r": "", "ra": ""},
 pluie:{"n": "When it rains", "m": "O Allah, (make it) a beneficial downpour.", "r": "", "ra": ""},
 apres_pluie:{"n": "After the rain", "m": "We have been given rain by the grace and mercy of Allah.", "r": "", "ra": ""},
 vent:{"n": "When the wind blows", "m": "O Allah, I ask You for its good, the good within it and the good it was sent with; and I seek refuge in You from its evil, the evil within it and the evil it was sent with.", "r": "", "ra": ""},
 tonnerre:{"n": "When it thunders", "m": "Glory be to the One whom the thunder glorifies with His praise, as do the angels out of fear of Him.", "r": "", "ra": ""},
 eternuement:{"n": "After sneezing", "m": "Praise be to Allah. (Then, to whoever replies « Yarhamuka-Llâh », he says: « Yahdîkumu-Llâhu wa yuslihu bâlakum » — May Allah guide you and set your affairs right.)", "r": "", "ra": ""},

function mkey(m){return m.sub? m.id+":"+(S.sub[m.id]||guessPrayer()) : m.id;}
function guessPrayer(){const mt=window.adhan&&momentFromTimes();if(mt&&mt.p)return mt.p;const L=window.adhan&&lastPrayer();if(L)return L.n;const h=new Date().getHours();return h<11?"Fajr":h<15?"Dhuhr":h<18?"Asr":h<20?"Maghrib":"Isha";}
function guessMoment(){const mt=window.adhan&&momentFromTimes();if(mt)return mt.m;const h=new Date().getHours();if(h<4||h>=22)return"coucher";if(h<6)return"reveil";if(h<12)return"matin";if(h<15)return"priere";if(h<19)return"soir";return"priere";}
function progress(m,day){day=day||today();const k=mkey(m);let done=0,tot=0;m.items.forEach(([id,n],i)=>{const c=Math.min(day[k+"|"+i+"|"+id]||0,n);done+=c;tot+=n;});return{done,tot,pct:tot?done/tot:0};}
function itemsDone(m,day){day=day||today();const k=mkey(m);return m.items.filter(([id,n],i)=>(day[k+"|"+i+"|"+id]||0)>=n).length;}

const PR=[["fajr","Fajr","الفجر"],["sunrise","Lever du soleil","الشروق"],["dhuhr","Dhuhr","الظهر"],["asr","Asr","العصر"],["maghrib","Maghrib","المغرب"],["isha","Isha","العشاء"]];
S.adj=S.adj||{};
function devTZ(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){return "";}}
function methodKey(){return WirdM.methodKey(S,devTZ());}
function params(){return WirdM.params(adhan,S,devTZ());}
function times(d){if(!S.loc||!window.adhan)return null;try{return new adhan.PrayerTimes(new adhan.Coordinates(S.loc.lat,S.loc.lon),d||new Date(),params());}catch(e){return null;}}
function hm(d){return d.toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:(S.loc&&S.loc.tz)||undefined});}
function hijri(){try{return new Intl.DateTimeFormat(LOC()+"-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric",timeZone:(S.loc&&S.loc.tz)||undefined}).format(new Date());}catch(e){return "";}}
function nextPrayer(){const t=times();if(!t)return null;const now=Date.now();for(const [k,n] of PR){if(k==="sunrise")continue;if(t[k].getTime()>now)return{k,n,at:t[k]};}
 const t2=times(new Date(now+864e5));return t2?{k:"fajr",n:"Fajr",at:t2.fajr}:null;}
function lastPrayer(){const t=times();if(!t)return null;const now=Date.now();let L=null;for(const [k,n] of PR){if(k==="sunrise")continue;if(t[k].getTime()<=now)L={k,n,at:t[k]};}return L;}
function untilTxt(ms){const m=Math.max(0,Math.round(ms/6e4)),U={ar:["س","د"],tr:["sa","dk"],id:["j","mnt"],nl:["u","min"],ms:["j","min"],ur:["گھنٹے","منٹ"],bn:["ঘণ্টা","মিনিট"]}[LANG]||["h","min"];if(m<60)return m+" "+U[1];return Math.floor(m/60)+" "+U[0]+" "+String(m%60).padStart(2,"0");}
/* Moment de la sunna selon les vraies heures, sinon selon l'horloge */
function momentFromTimes(){const t=times();if(!t)return null;const now=Date.now(),L=lastPrayer();
 if(L&&now-L.at.getTime()<40*6e4)return{m:"priere",p:L.n};
 if(now<t.fajr.getTime())return{m:"coucher"};
 if(now<t.dhuhr.getTime())return{m:"matin"};
 if(now<t.asr.getTime())return{m:"jour"};
 if(now<t.isha.getTime())return{m:"soir"};
 return{m:"coucher"};}

function startCompass(){const msg=$("#qMsg");const q=adhan.Qibla(new adhan.Coordinates(S.loc.lat,S.loc.lon));

function audPlay(key,list,onEnd){audStop();if(!list||!list.length)return;AUD=AUD||new Audio();audQ=list;audI=0;audKey=key;
 const step=()=>{AUD.src=audQ[audI];AUD.play().catch(()=>{audKey=null;paintAudio();toast(t("Lecture impossible. Vérifiez la connexion."));});};
 AUD.onended=()=>{if(++audI<audQ.length){step();return;}const k=audKey;audKey=null;paintAudio();if(onEnd)onEnd(k);};
 AUD.onerror=()=>{audKey=null;paintAudio();toast(t("Enregistrement indisponible pour le moment."));};
 step();paintAudio();motsLoad().then(karaoke);}

 if(!S.loc&&R.loc)S.loc=R.loc;save();sauver(true);return n;}

function lecTitre(i){const L=LECONS[i];return L==="voy"?t("lire.vowels"):L==="mots"?t("lire.words"):L.join(" ");}
function lecOuverte(i){return i===0||(LH.l[i-1]||0)>=1;}
function lecCourante(){for(let i=0;i<LECONS.length;i++)if(!(LH.l[i]>=1))return i;return LECONS.length-1;}
function pointsTxt(c){const p=DOTS[c];if(!p)return t("lire.dots0");return t(p[1]==="d"?"lire.dotsA":p[1]==="s"?"lire.dotsB":"lire.dotsI",p[0]);}
function renderLire(v){if(!MOTS){v.innerHTML=`<p class="note">…</p>`;motsLoad().then(()=>{if(view==="lire")render();});return;}
 if(LQ)return renderEtape(v);
 const n=nbConnues(),cur=lecCourante(),du=dues();
 let h=`<div class="card lhead"><div class="lring">${ringSVG(n/28)}</div><div><h2 style="margin:0 0 4px;font-size:19px">${t("lire.title")}</h2><p style="margin:0 0 6px;font-size:14px">${t("lire.intro2")}</p>
  <p class="lstats"><b>${t("lire.known",n)}</b> · 🔥 ${t("lire.streak",LH.st||0)} · ★ ${t("lire.xp",LH.xp||0)}</p></div></div>`;
 if(du.length)h+=`<button class="card lrev" id="lRev"><b>${t("lire.review")} · ${du.length}</b><span>${t("lire.reviewp2")}</span></button>`;
 h+=`<ol class="lpath">${LECONS.map((L,i)=>{const op=lecOuverte(i),st=LH.l[i]||0,c=i===cur;return `<li class="lnode${op?"":" off"}${c?" cur":""}${st?" done":""}"><button data-lec="${i}" ${op?"":"aria-disabled=\"true\""}>
   <span class="lpuce">${st?"✓":op?i+1:"🔒"}</span><span class="lnt"><span class="eyebrow">${t("lire.lesson",i+1)}</span><span class="lt${Array.isArray(L)?"":" lat"}" ${Array.isArray(L)?'dir="rtl"':""}>${lecTitre(i)}</span></span>
   <span class="ls">${st?"★".repeat(st)+"☆".repeat(3-st):c?`<b class="lgo1">${t("lire.start")}</b>`:""}</span></button></li>`;}).join("")}</ol>`;
 h+=`<div class="card"><b style="font-size:15px">${t("lire.alpha")}</b><p class="pnote" style="margin:2px 0 10px">${t("lire.alphap")}</p><div class="lalpha" dir="rtl">${LET.map(x=>`<button class="${connu(x[0])?"k":""}${(LH.k[x[0]]||0)>=3?" m":""}" data-al="${x[0]}" aria-label="${x[1]}">${x[0]}</button>`).join("")}</div></div>`;
 h+=`<p class="lcred">${t("lire.cred")}</p>`;
 v.innerHTML=h;
 v.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{ac();const i=+b.dataset.lec;if(!lecOuverte(i)){toast(t("lire.locked"));return;}LQ=lecon(i);render();window.scrollTo(0,0);});
 v.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{ac();jouerLettre(b.dataset.al);b.classList.add("on");setTimeout(()=>b.classList.remove("on"),500);});
 const r=$("#lRev");if(r)r.onclick=()=>{ac();LQ=revision(du);render();window.scrollTo(0,0);};}
function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* Distracteurs : d'abord les lettres de la même leçon, puis les déjà vues */
function autres(c,pool,n){const vus=LET.map(x=>x[0]).filter(x=>x!==c&&(pool.includes(x)||connu(x)));const base=vus.length>=n?vus:LET.map(x=>x[0]).filter(x=>x!==c);
 const proches=melange(base.filter(x=>SOEUR[x]===c||SOEUR[c]===x||SOEUR[x]&&SOEUR[x]===SOEUR[c]));return [...new Set(proches.concat(melange(base)))].slice(0,n);}
function qEcoute(c,pool){return {ty:"ecoute",c,ok:c,opts:melange([c].concat(autres(c,pool,2)))};}
function qForme(c,pool){const f=formes(c),p=f.length>2?1+Math.floor(Math.random()*3):1;return {ty:"forme",c,big:f[p],pos:p,ok:c,opts:melange([c].concat(autres(c,pool,2)))};}
function qMot(c){const I=index()||[];const avec=melange(I.filter(x=>brut(x[2]).includes(c)&&x[3].length<=5)),sans=melange(I.filter(x=>!x[3].includes(c)&&x[3].length<=5));if(!avec.length||sans.length<2)return null;
 const bon=avec[0];return {ty:"mot",c,mot:bon,ok:bon[2],opts:melange([bon[2],sans[0][2],sans[1][2]])};}
function qEcouteMot(pool){const I=(index()||[]).filter(x=>x[3].length<=6).slice(0,60);const ok=melange(I.filter(x=>!pool||x[3].every(connu)))[0]||melange(I)[0];if(!ok)return null;
 const faux=melange(I.filter(x=>x[2]!==ok[2]&&Math.abs(x[3].length-ok[3].length)<=2)).slice(0,2);if(faux.length<2)return null;return {ty:"ecmot",mot:ok,ok:ok[2],opts:melange([ok[2],faux[0][2],faux[1][2]])};}
function lecon(i){const L=LECONS[i],st=[];
 if(Array.isArray(L)){L.forEach((c,k)=>{st.push({ty:"intro",c},{ty:"formes",c});st.push(qEcoute(c,L.slice(0,k+1).concat(LECONS.slice(0,i).flat())));const m=qMot(c);if(m)st.push(m);});
  const fin=melange(L.map(c=>qForme(c,L)).concat(L.map(c=>qEcoute(c,L))));st.push(...fin.slice(0,Math.min(6,fin.length)));}
 else if(L==="voy"){VOY.forEach(v=>st.push({ty:"voy",v}));for(let k=0;k<6;k++){const q=qEcouteMot();if(q)st.push(q);}}
 else{const I=melange((index()||[]).filter(x=>x[3].length>=2&&x[3].length<=5).slice(0,24)).slice(0,4);I.forEach(x=>st.push({ty:"lire",mot:x}));for(let k=0;k<6;k++){const q=qEcouteMot(true);if(q)st.push(q);}}
 return {st,i:0,bon:0,nq:st.filter(x=>x.opts).length,lec:i,rep:null};}
function revision(du){const c=melange(du).slice(0,8),st=[];c.forEach((x,k)=>{const q=k%3===0?qForme(x,du):k%3===1?(qMot(x)||qEcoute(x,du)):qEcoute(x,du);st.push(q);});return {st,i:0,bon:0,nq:st.length,lec:-1,rep:null};}
function audioMot(x){return motsLoad().then(()=>jouerMot(x[0],x[1]));}
function renderEtape(v){const Q=LQ;if(Q.i>=Q.st.length)return renderFin(v);const e=Q.st[Q.i];
 let h=`<div class="lqtop"><button class="btn ghost" id="lQuit" aria-label="${t("lire.back")}">✕</button><div class="lbar"><i style="width:${100*Q.i/Q.st.length}%"></i></div></div>`;
 const fam=c=>{const s=SOEUR[c];return s?`<p class="lfam">${t("lire.fam",`<span class="arx">${s}</span>`)}</p>`:"";};
 if(e.ty==="intro"){const c=e.c,hint=(LHINT[c]&&(LHINT[c][LANG]||LHINT[c].en))||"";
  h+=`<div class="card lstep lintro"><span class="eyebrow">${t("lire.new")}</span><button class="lgiant" id="lPlay" aria-label="${t("lire.listen")}">${c}<span class="lspk">🔊</span></button>
   <h2 class="lname">${esc(nomL(c))} <span class="arx" dir="rtl">${LETM[c][4]}</span></h2>
   <p class="lsonl">${t("lire.sound")} : <b>${esc(son(c))}</b>${hint?` — ${esc(hint)}`:""}</p><p class="ldots">${pointsTxt(c)}</p>${fam(c)}</div>`;}
 else if(e.ty==="formes"){const c=e.c,f=formes(c),lab=f.length>2?["lire.f0","lire.f1","lire.f2","lire.f3"]:["lire.f0","lire.fj"];
  h+=`<div class="card lstep"><p class="lqq">${t(f.length>2?"lire.formes4":"lire.formes2",esc(nomL(c)))}</p><div class="lfrow" dir="rtl">${f.map((x,p)=>{const ex=exForme(c,p===1&&f.length===2?3:p);
   return `<div class="lfc"><span class="lfg">${x}</span><small>${t(lab[p])}</small>${ex?`<button class="lw" data-jm="${ex[0]}:${ex[1]}" dir="rtl">${colorer(ex[2],c)}</button>`:""}</div>`;}).join("")}</div>
   <p class="pnote" style="text-align:center">${t("lire.tapw")}</p></div>`;}
 else if(e.ty==="voy"){const [m,n,p]=e.v,I=index()||[];const ex=I.find(x=>x[2].includes(m)&&(m!=="ً"||/ً/.test(x[2])));
  h+=`<div class="card lstep lintro"><span class="eyebrow">${t("lire.vowels")}</span><div class="lgiant sm" dir="rtl">ب${m}</div><h2 class="lname">${n}</h2><p class="lsonl">${p.startsWith("lire.")?t(p):`${t("lire.sound")} : <b>${p}</b>`}</p>
   ${ex?`<p class="pnote">${t("lire.exv")}</p><button class="lw big" data-jm="${ex[0]}:${ex[1]}" dir="rtl">${colorer(ex[2],(x)=>x.t.includes(m))}</button>`:""}</div>`;}
 else if(e.ty==="lire"){const x=e.mot;h+=`<div class="card lstep lintro"><span class="eyebrow">${t("lire.words")}</span><p class="lqq">${t("lire.readit")}</p>
   <div class="lgiant word" dir="rtl">${brut(x[2]).map((c,k)=>`<span class="lpiece" style="--d:${k*0.12}s">${c}</span>`).join(`<span class="lplus">·</span>`)}</div>
   <button class="lw big" id="lWord" dir="rtl">${esc(x[2])}</button><p class="pnote">${t("lire.tapw")}</p></div>`;}
 else{const q=e;const titre=q.ty==="ecoute"?t("lire.qe"):q.ty==="forme"?t("lire.qf"):q.ty==="mot"?t("lire.q4",`<span class="arx">${q.c}</span>`):t("lire.q2");
  h+=`<div class="card lstep lq"><p class="lqq">${titre}</p>${q.ty==="forme"?`<div class="lgiant sm">${q.big}</div>`:""}${q.ty==="ecoute"||q.ty==="ecmot"?`<button class="lplaybig" id="lEc" aria-label="${t("lire.replay")}">🔊</button>`:""}
   <div class="lopts${q.ty==="ecoute"||q.ty==="forme"?" g3":""}">${q.opts.map(o=>`<button class="lopt ar" data-o="${esc(o)}" dir="rtl">${q.ty==="mot"&&Q.rep!=null&&o===q.ok?colorer(o,q.c):esc(o)}</button>`).join("")}</div></div>`;}
 h+=`<div class="lfoot" id="lFoot">${e.opts?`<p class="lfb" id="lFb"></p>`:""}<button class="btn lnext" id="lNx" ${e.opts?"hidden":""}>${t("lire.next")}</button></div>`;
 v.innerHTML=h;$("#lQuit").onclick=()=>{stopBuf();LQ=null;render();};
 const nx=()=>{stopBuf();Q.i++;Q.rep=null;render();window.scrollTo(0,0);};$("#lNx").onclick=nx;
 v.querySelectorAll("[data-jm]").forEach(b=>b.onclick=()=>{ac();const [id,k]=b.dataset.jm.split(":");b.classList.add("on");audioMot([id,+k]).then(()=>b.classList.remove("on"));});
 if(e.ty==="intro"){const p=()=>{ac();const b=$("#lPlay");b&&b.classList.add("on");Promise.resolve(jouerLettre(e.c)).then(()=>{const b2=$("#lPlay");b2&&b2.classList.remove("on");});};$("#lPlay").onclick=p;setTimeout(p,250);}
 if(e.ty==="lire"){const p=()=>{ac();audioMot(e.mot);};$("#lWord").onclick=p;setTimeout(p,900);}
 if(!e.opts)return;
 const ec=$("#lEc");if(ec){const p=()=>{ac();ec.classList.add("on");Promise.resolve(e.ty==="ecoute"?jouerLettre(e.c):audioMot(e.mot)).then(()=>ec.classList.remove("on"));};ec.onclick=p;setTimeout(p,250);}
 v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(Q.rep!=null)return;ac();const ok=b.dataset.o===e.ok;Q.rep=ok;b.classList.add(ok?"good":"bad");
  v.querySelectorAll("[data-o]").forEach(x=>{if(x.dataset.o===e.ok){x.classList.add("good");if(e.ty==="mot")x.innerHTML=colorer(e.ok,e.c);}else if(x!==b)x.classList.add("dim");});
  tonalite(ok);vib(ok?18:[30,40,30]);
  if(ok){Q.bon++;LH.xp=(LH.xp||0)+10;}if(e.c)noter(e.c,ok);save();
  if(e.mot&&e.ty==="mot")setTimeout(()=>audioMot(e.mot),350);if(e.ty==="ecoute"&&!ok)setTimeout(()=>jouerLettre(e.c),350);
  const f=$("#lFoot");f.classList.add(ok?"ok":"ko");
  $("#lFb").innerHTML=ok?`<b>${melange([t("lire.ok"),t("lire.ok2"),t("lire.ok3")])[0]}</b>`:`${t("lire.ko",`<b class="arx" dir="rtl">${esc(e.ok)}</b>`)}${e.ty==="ecoute"||e.ty==="forme"?` · ${esc(nomL(e.ok))}`:""}`;
  $("#lNx").hidden=false;$("#lNx").focus({preventScroll:true});});}
function renderFin(v){const Q=LQ,n=Math.max(1,Q.nq),r=Q.bon/n,st=r>=0.95?3:r>=0.75?2:r>=0.6?1:0;serie();let msg="";
 if(Q.lec>=0){const av=LH.l[Q.lec]||0;if(st>=1){if(av===0&&Q.lec<LECONS.length-1)msg=t("lire.unlock");LH.l[Q.lec]=Math.max(av,st);
   if(Array.isArray(LECONS[Q.lec]))LECONS[Q.lec].forEach(c=>{if(!connu(c))noter(c,true);});}else msg=t("lire.retry2");}
 save();
 v.innerHTML=`<div class="card lfin"><div class="lstars">${[0,1,2].map(k=>`<span class="${k<st?"on":""}" style="--d:${k*0.18}s">★</span>`).join("")}</div><h2>${t("lire.done",Q.bon,Q.nq)}</h2>${msg?`<p>${msg}</p>`:""}<p class="lstats">🔥 ${t("lire.streak",LH.st)} · ★ ${t("lire.xp",LH.xp)} · ${t("lire.known",nbConnues())}</p>
  <div class="halrow">${Q.lec>=0&&st>=1&&Q.lec<LECONS.length-1?`<button class="btn" id="lSuiv">${t("lire.nextl")} →</button>`:`<button class="btn" id="lAg">${t("lire.again")}</button>`}<button class="btn alt" id="lBk">${t("lire.back")}</button></div></div>`;
 tonalite(true);vib([30,50,30,50,60]);
 const ag=$("#lAg");if(ag)ag.onclick=()=>{LQ=Q.lec>=0?lecon(Q.lec):revision(dues().length?dues():LET.map(x=>x[0]).filter(connu));render();window.scrollTo(0,0);};
 const sv=$("#lSuiv");if(sv)sv.onclick=()=>{LQ=lecon(Q.lec+1);render();window.scrollTo(0,0);};
 $("#lBk").onclick=()=>{LQ=null;save();render();};}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.v));
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=RTL()?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));$("#cUndo").setAttribute("aria-label",t("Annuler 1"));$("#cReset").setAttribute("aria-label",t("Remettre à 0"));
 const ls=$("#langSel");ls.innerHTML=Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${k===LANG?"selected":""}>${n}</option>`).join("");}
applyLang();
avisPaint();
$("#langSel").onchange=e=>{S.lang=e.target.value;save();LANG=S.lang;loadLangPack().then(()=>{applyLang();go(view);avisPaint();});avisPaint();applyLang();$("#date").textContent=new Date().toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"});go(view);pushSync();};
$("#date").textContent=new Date().toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"});
if(!S.ab){S.ab=S.neuf?(Math.random()<.5?"a":"b"):"b";}S.opens=(S.opens||0)+1;save();tabH();
if(!openFromHash())go(S.ab==="a"?"jour":"compter");tSend("open");mondeLoad();setTimeout(()=>langBanner(false),2500);adhanPlan();
if((!C||C.dock)&&S.open&&S.open.id!==(C&&C.m.id)){const o=S.open;let m=null;if(o.d===dayKey()&&Date.now()-o.ts<3*36e5){if(o.id==="libre"&&D[o.it])m={id:"libre",nom:"Compteur libre",items:[[o.it,0]]};else{m=M.find(x=>x.id===o.id);if(m){curMoment=m.id;if(m.sub&&o.sub)S.sub[m.id]=o.sub;}}}
 if(m){go("compter");homeOpen(m,Math.min(o.i,m.items.length-1));}else{delete S.open;save();}}
loadLangPack().then(()=>{if(DLX[LANG]){applyLang();avisPaint();if(!C)go(view);}});
if(S.push.on&&S.push.sync!==dayKey()){pushSync().then(r=>{if(r){S.push.sync=dayKey();save();}});}

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script></body></html>
